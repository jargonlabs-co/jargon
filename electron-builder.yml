appId: com.jargon.app
productName: Jargon
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!tsconfig*.json'
  - '!landing/*'
  - '!data/*'
  - '!.env*'
  - '!release/*'
asarUnpack:
  - '**/node_modules/electron-updater/**'
mac:
  category: public.app-category.business
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - nsis
linux:
  target:
    - AppImage
protocols:
  - name: Jargon
    schemes:
      - jargon
publish:
  provider: generic
  url: https://downloads.jargon.app/desktop
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
