<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jargon email</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--color-background-primary, #fff);
      --bg2: var(--color-background-secondary, #f4f4f2);
      --fg: var(--color-text-primary, #161513);
      --muted: var(--color-text-secondary, #6b6966);
      --line: var(--color-border-tertiary, #e4e2dc);
      --accent: var(--color-text-accent, #161513);
      --danger: #b42318;
      --ok: #17663a;
      --pad: 14px;
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    :root.dark {
      --bg: var(--color-background-primary, #1c1b19);
      --bg2: var(--color-background-secondary, #242320);
      --fg: var(--color-text-primary, #f4f2ee);
      --muted: var(--color-text-secondary, #a8a59e);
      --line: var(--color-border-tertiary, #3a3834);
      --accent: var(--color-text-accent, #f4f2ee);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { padding: var(--pad); padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom, 0px)); }
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
      padding: 6px 10px; font-weight: 550;
    }
    .btn:hover { background: var(--bg2); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .btn.primary:hover { opacity: 0.92; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .tab {
      border: 0; background: transparent; padding: 8px 10px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab.on { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
    .banner {
      background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; margin-bottom: 12px; color: var(--muted); font-size: 12px;
    }
    .banner.err { color: var(--danger); }
    .banner.ok { color: var(--ok); }
    label { display: block; font-size: 11px; color: var(--muted); margin: 6px 0 4px; }
    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); padding: 8px 10px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .people { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .person {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left;
      background: var(--bg); width: 100%; border-left: 0; border-right: 0; border-top: 0;
    }
    .person:last-child { border-bottom: 0; }
    .person:hover, .person.on { background: var(--bg2); }
    .meta { color: var(--muted); font-size: 12px; }
    .pill { font-size: 11px; color: var(--muted); }
    .composer { margin-top: 12px; }
    .to { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .row input[type="datetime-local"] { width: auto; min-width: 180px; }
    .empty { color: var(--muted); padding: 20px 4px; }

    .seg {
      display: flex; gap: 4px; background: var(--bg2); border-radius: 8px; padding: 3px;
      width: fit-content; margin-bottom: 12px;
    }
    .seg button {
      border: 0; background: transparent; border-radius: 6px; padding: 5px 10px;
      color: var(--muted); font-weight: 550;
    }
    .seg button.on { background: var(--bg); color: var(--fg); }

    .canvas {
      background: var(--bg2);
      border-radius: 12px;
      padding: 28px 16px 36px;
    }
    .flow {
      display: flex; flex-direction: column; align-items: center;
      width: min(300px, 100%); margin: 0 auto;
    }
    .wire {
      width: 1.5px; height: 18px; background: color-mix(in srgb, var(--muted) 28%, transparent);
    }
    .joint {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--bg); border: 1.5px solid color-mix(in srgb, var(--muted) 35%, transparent);
    }
    .node {
      width: 100%; background: var(--bg); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px 11px; text-align: left;
      box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 6%, transparent);
    }
    button.node { cursor: pointer; }
    button.node:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--line)); }
    button.node.on { border-color: var(--fg); }
    .node-top { display: flex; gap: 8px; align-items: flex-start; }
    .node-copy { min-width: 0; flex: 1; }
    .ico {
      width: 18px; height: 18px; display: grid; place-items: center;
      flex-shrink: 0; margin-top: 1px; color: var(--fg);
    }
    .ico svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .ico.bolt svg { fill: currentColor; stroke: none; }
    .kicker { font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
    .title { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview {
      color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; padding-top: 2px;
    }
    .live {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid color-mix(in srgb, var(--ok) 35%, var(--line));
      background: color-mix(in srgb, var(--ok) 8%, var(--bg));
      border-radius: 999px; padding: 3px 8px 3px 6px;
      font-size: 11px; font-weight: 650; color: var(--ok);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .mail-mini { width: 14px; height: 14px; color: var(--muted); }
    .mail-mini svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .editor {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; background: var(--bg);
    }
    .editor-h { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .editor-h strong { font-size: 13px; }
    .step-pills { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; }
    .cadence { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .chip {
      font-size: 10px; font-weight: 650; border-radius: 999px;
      padding: 2px 7px; border: 1px solid var(--line); color: var(--muted);
    }
    .chip.queued { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
    .chip.sent { color: var(--ok); }
    .chip.cancelled, .chip.failed { color: var(--danger); }
    .when { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .filters { margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="wrap" id="root"><p class="empty">Loading email workspace…</p></div>
  <script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App, applyDocumentTheme } = globalThis.ExtApps;

const ICO = {
  bolt: '<svg viewBox="0 0 16 16"><polygon points="9,1 3.5,9 7.5,9 6.5,15 13,7 8.8,7"/></svg>',
  clock: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.2 1.4"/></svg>',
  mail: '<svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1.4"/><path d="m2.6 4.4 5.4 4 5.4-4"/></svg>',
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function interpolate(template, contact) {
  if (!template) return '';
  const first = (contact.name || '').split(/\s+/)[0] || contact.name || '';
  const last = (contact.name || '').split(/\s+/).slice(1).join(' ');
  const vars = {
    name: contact.name || '',
    first_name: first,
    last_name: last,
    email: contact.email || '',
    title: contact.title || '',
    company: contact.company || '',
    city: contact.city || '',
  };
  for (const [k, v] of Object.entries(contact.attrs || {})) {
    const text = Array.isArray(v) ? v.join(' · ') : String(v ?? '');
    vars[k] = text;
    vars[`attrs.${k}`] = text;
  }
  return template.replace(/\{\{\s*([^}]+)\s*\}\}/g, (_, raw) => vars[raw.trim()] ?? '');
}

function parseToolResult(result) {
  if (!result) return null;
  if (result.isError) {
    const t = result.content?.[0]?.text;
    return { error: t || 'Request failed' };
  }
  const text = result.content?.find((c) => c.type === 'text')?.text;
  if (!text) return result.structuredContent || result;
  try { return JSON.parse(text); } catch { return { error: text }; }
}

function latestMessage(ws, contactId) {
  return (ws.messages || []).find((m) => m.contactId === contactId && m.channel === 'email') || null;
}

function statusLabel(ws, contact) {
  const msg = latestMessage(ws, contact.id);
  if (msg?.status === 'sent') return 'Sent';
  if (msg?.status === 'queued') return 'Scheduled';
  if (msg?.status === 'draft') return 'Draft';
  if (!contact.email) return 'No email';
  return contact.status || 'Queued';
}

function oneLine(text) {
  return String(text || '').replace(/\s+/g, ' ').trim();
}

function messageFor(ws, contactId, step) {
  const msgs = (ws?.messages || []).filter((m) => m.contactId === contactId && m.channel === 'email');
  if (step?.id) {
    const hit = msgs.find((m) => m.stepId === step.id);
    if (hit) return hit;
  }
  return null;
}

function toLocalInput(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function cadenceLabel(ws, contact, steps) {
  let queued = 0;
  let sent = 0;
  let any = false;
  for (const step of steps) {
    const msg = messageFor(ws, contact.id, step);
    if (!msg) continue;
    any = true;
    if (msg.status === 'queued') queued += 1;
    if (msg.status === 'sent') sent += 1;
  }
  if (queued) return `${queued} scheduled`;
  if (sent && sent === steps.length) return 'Sent';
  if (sent) return `${sent} sent`;
  return statusLabel(ws, contact);
}

(async () => {
  const app = new App({ name: 'jargon-email', version: '1.3.0' }, {}, { autoResize: true });
  const root = document.getElementById('root');
  let ws = null;
  let tab = 'sequence';
  let seqPane = 'flow';
  let selectedStep = 0;
  let selectedId = null;
  let selectedMessageId = null;
  let inboxFilter = 'all';
  let notice = '';
  let noticeTone = '';
  let busy = false;
  let pendingSend = false;
  let pendingStart = false;
  let peopleStep = 0;
  let draftSteps = [];

  function surface() {
    if (!ws) return 'sequence';
    if (ws.surface) return ws.surface;
    return ws.view === 'overflow' ? 'overflow' : 'sequence';
  }

  function applySurface() {
    const s = surface();
    if (s === 'one_off') tab = 'people';
    else if (s === 'inbox') tab = 'inbox';
    else if (s === 'sequence') tab = 'sequence';
  }

  function emailSteps() {
    const emails = draftSteps.filter((s) => s.channel === 'email');
    return emails.length ? emails : draftSteps;
  }

  function syncDrafts() {
    draftSteps = (ws?.steps || []).map((s) => ({ ...s }));
    const n = emailSteps().length;
    if (selectedStep >= n) selectedStep = Math.max(0, n - 1);
    if (peopleStep >= n) peopleStep = Math.max(0, n - 1);
  }

  function themeFromHost() {
    const ctx = app.getHostContext?.() || {};
    const theme = ctx.theme === 'dark' ? 'dark' : 'light';
    document.documentElement.classList.toggle('dark', theme === 'dark');
    applyDocumentTheme?.(theme);
    const insets = ctx.safeAreaInsets;
    if (insets) {
      document.documentElement.style.setProperty('--pad', `${Math.max(14, insets.top || 0)}px`);
    }
  }

  function setNotice(text, tone) {
    notice = text || '';
    noticeTone = tone || '';
    render();
  }

  async function reload() {
    if (!ws?.projectId) return;
    const result = await app.callServerTool({
      name: 'load_email_workspace',
      arguments: { projectId: ws.projectId },
    });
    const next = parseToolResult(result);
    if (next?.error) { setNotice(next.error, 'err'); return; }
    ws = next;
    syncDrafts();
    render();
  }

  async function openWorkspace() {
    if (!ws?.dashboardUrl) return;
    await app.openLink({ url: ws.dashboardUrl });
  }

  function flushEditor() {
    const steps = emailSteps();
    const step = steps[selectedStep];
    if (!step || seqPane !== 'email') return;
    const dayEl = document.getElementById('edit-day');
    const labelEl = document.getElementById('edit-label');
    const subjectEl = document.getElementById('edit-subject');
    const bodyEl = document.getElementById('edit-body');
    if (dayEl) step.day = Number(dayEl.value || step.day || 0);
    if (labelEl) step.label = labelEl.value;
    if (subjectEl) step.subject = subjectEl.value;
    if (bodyEl) step.body = bodyEl.value;
  }

  async function saveSequence() {
    flushEditor();
    const originals = ws.steps || [];
    const hasEmail = originals.some((s) => s.channel === 'email');
    const edited = emailSteps();
    let i = 0;
    const steps = originals.map((step) => {
      if (hasEmail && step.channel !== 'email') {
        return { day: step.day, channel: step.channel, label: step.label, subject: step.subject, body: step.body };
      }
      const next = edited[i++] || step;
      return {
        day: Number(next.day || 0),
        channel: next.channel,
        label: next.label,
        subject: next.subject || '',
        body: next.body || '',
      };
    });
    busy = true; render();
    const result = await app.callServerTool({
      name: 'update_sequence',
      arguments: { projectId: ws.projectId, goal: ws.goal, steps },
    });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice('Sequence saved.', 'ok');
    app.updateModelContext?.({
      content: [{ type: 'text', text: `Updated email sequence for ${ws.name} (${steps.length} steps).` }],
    });
  }

  function selectedEmailMessage(contact) {
    if (selectedMessageId) {
      return (ws.messages || []).find((m) => m.id === selectedMessageId) || null;
    }
    if (!contact) return null;
    const step = emailSteps()[peopleStep] || emailSteps()[0];
    return messageFor(ws, contact.id, step) || latestMessage(ws, contact.id);
  }

  function currentDraftFields(contact) {
    const step = emailSteps()[peopleStep] || emailSteps()[0];
    const msg = selectedEmailMessage(contact);
    return {
      subject: document.getElementById('draft-subject')?.value
        ?? msg?.subject
        ?? interpolate(step?.subject || '', contact),
      body: document.getElementById('draft-body')?.value
        ?? msg?.body
        ?? interpolate(step?.body || '', contact),
    };
  }

  async function saveDraft(contact) {
    const { subject, body } = currentDraftFields(contact);
    const existing = selectedEmailMessage(contact);
    busy = true; render();
    const result = existing
      ? await app.callServerTool({
          name: 'update_draft',
          arguments: { messageId: existing.id, subject, body },
        })
      : await app.callServerTool({
          name: 'save_draft',
          arguments: { contactId: contact.id, subject, body, channel: 'email' },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice(`Draft saved for ${contact.name}.`, 'ok');
  }

  async function sendNow(contact) {
    if (!contact.email) { setNotice('This person has no email address.', 'err'); return; }
    if (!pendingSend) {
      pendingSend = true;
      setNotice(`Send to ${contact.email}? This uses Gmail credits.`, '');
      return;
    }
    pendingSend = false;
    const { subject, body } = currentDraftFields(contact);
    const existing = selectedEmailMessage(contact);
    busy = true; render();
    const result = existing && existing.status !== 'sent'
      ? await app.callServerTool({ name: 'send_draft', arguments: { messageId: existing.id } })
      : await app.callServerTool({
          name: 'send_message',
          arguments: { contactId: contact.id, subject, body, channel: 'email', status: 'sent' },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice(`Sent to ${contact.name}.`, 'ok');
    app.updateModelContext?.({
      content: [{ type: 'text', text: `Sent email to ${contact.name} <${contact.email}>.` }],
    });
  }

  async function schedule(contact) {
    if (!contact.email) { setNotice('This person has no email address.', 'err'); return; }
    const when = document.getElementById('send-at')?.value;
    if (!when) { setNotice('Pick a send time.', 'err'); return; }
    const sendAt = new Date(when).toISOString();
    const { subject, body } = currentDraftFields(contact);
    const existing = selectedEmailMessage(contact);
    busy = true; render();
    const result = existing
      ? await app.callServerTool({
          name: 'update_draft',
          arguments: { messageId: existing.id, subject, body, sendAt, status: 'queued' },
        })
      : await app.callServerTool({
          name: 'send_message',
          arguments: { contactId: contact.id, subject, body, channel: 'email', status: 'queued', sendAt },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice(`Scheduled for ${contact.name}.`, 'ok');
  }

  async function startSequence() {
    if (!pendingStart) {
      pendingStart = true;
      setNotice('Start this sequence for everyone? Day 0 sends now; later emails send on their wait days.', '');
      return;
    }
    pendingStart = false;
    busy = true; render();
    const result = await app.callServerTool({
      name: 'start_sequence',
      arguments: { projectId: ws.projectId },
    });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    ws = parsed;
    syncDrafts();
    setNotice('Sequence started. Emails are queued by day and will send automatically.', 'ok');
    app.updateModelContext?.({
      content: [{ type: 'text', text: `Started the email sequence for ${ws.name} (${ws.contactCount} contacts).` }],
    });
  }

  async function askClaudeToWrite() {
    await app.sendMessage({
      role: 'user',
      content: [{
        type: 'text',
        text: surface() === 'inbox'
          ? `Write or refresh email drafts for project ${ws.projectId} from the research in this chat. Call save_draft for each person who has an email, then call show_email_workspace.`
          : surface() === 'one_off'
            ? `Write a personalized one-off email for each contact in project ${ws.projectId} using their fields and the research in this chat. Call save_draft for each person who has an email, then call show_email_workspace. Do not start a sequence.`
            : `Write personalized email drafts for each contact in project ${ws.projectId} using the sequence templates and their fields. Call save_draft for each person who has an email, then call show_email_workspace.`,
      }],
    });
  }

  function renderOverflow() {
    root.innerHTML = `
      <header>
        <div>
          <h1>${esc(ws.name)}</h1>
          <div class="sub">${esc((ws.channels || []).join(' · ') || 'Workspace')} · ${ws.contactCount} contacts</div>
        </div>
        <div class="actions">
          <button class="btn primary" id="open">Open workspace</button>
        </div>
      </header>
      <div class="banner">This motion is not email. Continue in Jargon for the queue or dialer.</div>
    `;
    root.querySelector('#open')?.addEventListener('click', openWorkspace);
  }

  function connector() {
    return `<div class="wire"></div><div class="joint"></div><div class="wire"></div>`;
  }

  function triggerCard() {
    const who = ws.contactCount === 1 ? '1 contact enters' : `${ws.contactCount} contacts enter`;
    return `
      <div class="node">
        <div class="node-top">
          <span class="ico bolt">${ICO.bolt}</span>
          <div class="node-copy">
            <div class="kicker">Trigger</div>
            <div class="preview">${esc(who)}${ws.goal ? ` · ${esc(ws.goal)}` : ''}</div>
          </div>
        </div>
      </div>
    `;
  }

  function waitCard(i, days) {
    const n = Math.max(0, days);
    const label = n === 1 ? 'Wait 1 day' : `Wait ${n} days`;
    return `
      <button class="node wait" type="button" data-step="${i}">
        <div class="node-top">
          <span class="ico">${ICO.clock}</span>
          <div class="node-copy">
            <div class="kicker">${esc(label)}</div>
          </div>
        </div>
      </button>
    `;
  }

  function emailCard(step, i, live) {
    const title = step.label || `Email ${i + 1}`;
    const preview = oneLine(step.subject || step.body) || 'No copy yet';
    return `
      <button class="node ${selectedStep === i && seqPane === 'email' ? 'on' : ''}" type="button" data-step="${i}">
        <div class="node-top">
          <span class="ico">${ICO.mail}</span>
          <div class="node-copy">
            <div class="title">${esc(title)}</div>
            <div class="preview">${esc(preview)}</div>
          </div>
        </div>
        <div class="foot">
          <span class="mail-mini">${ICO.mail}</span>
          ${live ? `<span class="live"><span class="dot"></span>Live</span>` : `<span class="pill">Draft</span>`}
        </div>
      </button>
    `;
  }

  function renderFlow() {
    const steps = emailSteps();
    const live = Boolean(ws.emailLive) && !ws.sandbox;
    let html = `<div class="canvas"><div class="flow">${triggerCard()}`;
    steps.forEach((step, i) => {
      const prev = i === 0 ? 0 : Number(steps[i - 1].day || 0);
      const wait = Number(step.day || 0) - prev;
      html += connector();
      if (wait > 0) {
        html += waitCard(i, wait);
        html += connector();
      }
      html += emailCard(step, i, live);
    });
    if (!steps.length) html += `${connector()}<p class="empty">No email steps yet.</p>`;
    html += `</div></div>`;
    return html;
  }

  function renderEmailEditor() {
    const steps = emailSteps();
    const step = steps[selectedStep];
    if (!step) return '<p class="empty">No email selected.</p>';
    return `
      <div class="editor">
        <div class="step-pills">
          ${steps.map((s, i) => `<button class="btn ${i === selectedStep ? 'primary' : ''}" type="button" data-step="${i}">${esc(s.label || `Email ${i + 1}`)}</button>`).join('')}
        </div>
        <div class="editor-h">
          <strong>Email ${selectedStep + 1}${steps.length > 1 ? ` of ${steps.length}` : ''}</strong>
        </div>
        <label>Send on day</label>
        <input id="edit-day" type="text" value="${esc(step.day)}" />
        <label>Label</label>
        <input id="edit-label" type="text" value="${esc(step.label || '')}" />
        <label>Subject</label>
        <input id="edit-subject" type="text" value="${esc(step.subject || '')}" />
        <label>Body</label>
        <textarea id="edit-body">${esc(step.body || '')}</textarea>
      </div>
    `;
  }

  function renderSequence() {
    return `
      <div class="seg">
        <button type="button" class="${seqPane === 'flow' ? 'on' : ''}" data-pane="flow">Flow</button>
        <button type="button" class="${seqPane === 'email' ? 'on' : ''}" data-pane="email">Emails</button>
      </div>
      ${seqPane === 'flow' ? renderFlow() : renderEmailEditor()}
      <div class="row">
        <button class="btn primary" id="start-seq" ${busy ? 'disabled' : ''}>${pendingStart ? 'Confirm start' : 'Start sequence'}</button>
        <button class="btn" id="save-seq" ${busy ? 'disabled' : ''}>Save sequence</button>
        <button class="btn" id="write">Ask Claude to write drafts</button>
      </div>
    `;
  }

  function contactById(id) {
    return (ws.contacts || []).find((c) => c.id === id) || null;
  }

  function inboxMessages() {
    let msgs = (ws.messages || []).filter((m) => m.channel === 'email');
    msgs = [...msgs].sort((a, b) => (b.sentAt || b.sendAt || b.createdAt || 0) - (a.sentAt || a.sendAt || a.createdAt || 0));
    if (inboxFilter !== 'all') msgs = msgs.filter((m) => m.status === inboxFilter);
    return msgs;
  }

  function formatWhen(msg) {
    const ms = msg.sentAt || msg.sendAt || msg.createdAt;
    if (!ms) return '';
    const d = new Date(ms);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function renderComposer(selected, opts) {
    const hideSteps = Boolean(opts?.hideSteps);
    const showWrite = Boolean(opts?.showWrite);
    const steps = emailSteps();
    if (peopleStep >= steps.length) peopleStep = Math.max(0, steps.length - 1);
    const step = steps[peopleStep] || steps[0];
    const msg = selected ? selectedEmailMessage(selected) : null;
    const subject = msg?.subject || (selected && step ? interpolate(step.subject || '', selected) : '');
    const body = msg?.body || (selected && step ? interpolate(step.body || '', selected) : '');
    const showSteps = !hideSteps && steps.length > 1;
    return `
      <div class="composer">
        <div class="to">${esc(selected.name)} · ${esc(selected.email || 'missing email')}</div>
        ${showSteps ? `
          <div class="step-pills" style="margin: 8px 0;">
            ${steps.map((s, i) => {
              const m = messageFor(ws, selected.id, s);
              const st = m?.status || 'template';
              return `<button class="btn ${i === peopleStep ? 'primary' : ''}" type="button" data-people-step="${i}">${esc(s.label || `Email ${i + 1}`)} <span class="chip ${esc(st)}">${esc(st)}</span></button>`;
            }).join('')}
          </div>
        ` : ''}
        <label>Subject</label>
        <input id="draft-subject" type="text" value="${esc(subject)}" />
        <label>Body</label>
        <textarea id="draft-body">${esc(body)}</textarea>
        <div class="row">
          <button class="btn" id="save-draft" ${busy ? 'disabled' : ''}>Save draft</button>
          <button class="btn primary" id="send" ${busy || !selected.email || msg?.status === 'sent' ? 'disabled' : ''}>${pendingSend ? 'Confirm send' : 'Send now'}</button>
          <input id="send-at" type="datetime-local" value="${esc(toLocalInput(msg?.sendAt))}" />
          <button class="btn" id="schedule" ${busy || !selected.email || msg?.status === 'sent' ? 'disabled' : ''}>Schedule</button>
          ${showWrite ? `<button class="btn" id="write">Ask Claude to write</button>` : ''}
        </div>
      </div>
    `;
  }

  function renderPeople() {
    const people = ws.contacts || [];
    const oneOff = surface() === 'one_off';
    const selected = people.find((c) => c.id === selectedId) || people[0];
    if (selected && selectedId !== selected.id) {
      selectedId = selected.id;
      selectedMessageId = null;
      pendingSend = false;
    }
    const steps = emailSteps();
    return `
      ${!people.length ? '<p class="empty">No contacts yet. Import a list in Claude, or connect HubSpot / Railway and deploy again.</p>' : `
        ${ws.contactsTotal > people.length ? `<div class="banner">Showing ${people.length} of ${ws.contactsTotal}. Open workspace for the full list.</div>` : ''}
        ${oneOff ? `<p class="sub" style="margin: 0 0 10px;">One-off emails — edit and send each person. No cadence.</p>` : ''}
        <div class="people">
          ${people.map((c) => `
            <button class="person ${c.id === selectedId ? 'on' : ''}" data-id="${esc(c.id)}">
              <div>
                <div>${esc(c.name)}</div>
                <div class="meta">${esc([c.title, c.company, c.email || 'no email'].filter(Boolean).join(' · '))}</div>
              </div>
              <div class="pill">${esc(oneOff ? statusLabel(ws, c) : cadenceLabel(ws, c, steps))}</div>
            </button>
          `).join('')}
        </div>
      `}
      ${selected ? renderComposer(selected, { hideSteps: oneOff, showWrite: oneOff }) : ''}
    `;
  }

  function renderInbox() {
    const msgs = inboxMessages();
    const selectedMsg = msgs.find((m) => m.id === selectedMessageId) || msgs[0] || null;
    if (selectedMsg) {
      selectedMessageId = selectedMsg.id;
      selectedId = selectedMsg.contactId;
    }
    const selected = selectedMsg ? contactById(selectedMsg.contactId) : (ws.contacts || []).find((c) => c.id === selectedId) || (ws.contacts || [])[0];
    const counts = {
      all: (ws.messages || []).filter((m) => m.channel === 'email').length,
      draft: ws.stats?.drafts || 0,
      queued: ws.stats?.queued || 0,
      sent: ws.stats?.sent || 0,
    };
    return `
      <div class="seg filters">
        ${['all', 'draft', 'queued', 'sent'].map((f) => `
          <button type="button" class="${inboxFilter === f ? 'on' : ''}" data-filter="${f}">${f === 'all' ? `All (${counts.all})` : `${f[0].toUpperCase()}${f.slice(1)} (${counts[f]})`}</button>
        `).join('')}
      </div>
      ${!msgs.length ? `<p class="empty">${counts.all ? 'Nothing in this filter.' : 'No emails yet. Open People to compose, or ask Claude to write drafts.'}</p>` : `
        <div class="people">
          ${msgs.map((m) => {
            const c = contactById(m.contactId);
            return `
              <button class="person ${m.id === selectedMessageId ? 'on' : ''}" data-msg="${esc(m.id)}" data-id="${esc(m.contactId)}">
                <div>
                  <div>${esc(c?.name || 'Unknown')} · ${esc(m.subject || '(no subject)')}</div>
                  <div class="meta">${esc(oneLine(m.body) || '—')}</div>
                </div>
                <div>
                  <div class="chip ${esc(m.status)}">${esc(m.status)}</div>
                  <div class="when">${esc(formatWhen(m))}</div>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `}
      ${selected ? renderComposer(selected, { hideSteps: true, showWrite: !msgs.length }) : ''}
    `;
  }

  function renderTabs() {
    const s = surface();
    if (s === 'one_off') return '';
    if (s === 'inbox') {
      return `
        <div class="tabs">
          <button class="tab ${tab === 'inbox' ? 'on' : ''}" data-tab="inbox">Inbox</button>
          <button class="tab ${tab === 'people' ? 'on' : ''}" data-tab="people">People</button>
        </div>
      `;
    }
    return `
      <div class="tabs">
        <button class="tab ${tab === 'sequence' ? 'on' : ''}" data-tab="sequence">Sequence</button>
        <button class="tab ${tab === 'people' ? 'on' : ''}" data-tab="people">People</button>
      </div>
    `;
  }

  function renderPanel() {
    const s = surface();
    if (s === 'one_off') return renderPeople();
    if (tab === 'inbox' || (s === 'inbox' && tab !== 'people')) return renderInbox();
    if (tab === 'people') return renderPeople();
    return renderSequence();
  }

  function surfaceLabel() {
    const s = surface();
    if (s === 'inbox') return 'Inbox';
    if (s === 'one_off') return 'One-off emails';
    if (s === 'sequence') return 'Sequence';
    return '';
  }

  function render() {
    if (!ws) {
      root.innerHTML = '<p class="empty">Waiting for workspace data…</p>';
      return;
    }
    if (ws.view === 'overflow' || surface() === 'overflow') { renderOverflow(); return; }
    if (!draftSteps.length && ws.steps?.length) syncDrafts();
    const sources = (ws.sources || [])
      .filter((s) => s.status === 'connected')
      .map((s) => s.accountLabel || s.provider)
      .join(', ');
    const mail = ws.sandbox ? 'sandbox' : ws.emailLive ? 'Gmail live' : 'Gmail not configured';
    const kind = surfaceLabel();
    root.innerHTML = `
      <header>
        <div>
          <h1>${esc(ws.name)}</h1>
          <div class="sub">${kind ? `${esc(kind)} · ` : ''}${ws.contactCount} contacts · ${esc(mail)}${sources ? ` · ${esc(sources)}` : ''}${ws.stats?.missingEmail ? ` · ${ws.stats.missingEmail} missing email` : ''}</div>
        </div>
        <div class="actions">
          <button class="btn" id="full">Full screen</button>
          <button class="btn" id="open">Open workspace</button>
        </div>
      </header>
      ${notice ? `<div class="banner ${noticeTone}">${esc(notice)}</div>` : ''}
      ${renderTabs()}
      <div id="panel">${renderPanel()}</div>
    `;
    bindWorkspace();
  }

  function bindWorkspace() {
    root.querySelector('#open')?.addEventListener('click', openWorkspace);
    root.querySelector('#full')?.addEventListener('click', () => app.requestDisplayMode({ mode: 'fullscreen' }));
    root.querySelectorAll('.tab').forEach((el) => el.addEventListener('click', () => {
      flushEditor();
      tab = el.getAttribute('data-tab');
      if (tab !== 'inbox') selectedMessageId = null;
      render();
    }));
    root.querySelectorAll('[data-pane]').forEach((el) => el.addEventListener('click', () => {
      flushEditor();
      seqPane = el.getAttribute('data-pane');
      render();
    }));
    root.querySelectorAll('[data-step]').forEach((el) => el.addEventListener('click', () => {
      flushEditor();
      selectedStep = Number(el.getAttribute('data-step'));
      seqPane = 'email';
      render();
    }));
    root.querySelectorAll('[data-filter]').forEach((el) => el.addEventListener('click', () => {
      inboxFilter = el.getAttribute('data-filter');
      selectedMessageId = null;
      render();
    }));
    const editing = emailSteps()[selectedStep];
    if (editing && seqPane === 'email') {
      const bind = (id, key, parse) => {
        document.getElementById(id)?.addEventListener('input', (e) => {
          const value = e.target.value;
          editing[key] = parse ? parse(value) : value;
        });
      };
      bind('edit-day', 'day', (v) => Number(v || 0));
      bind('edit-label', 'label');
      bind('edit-subject', 'subject');
      bind('edit-body', 'body');
    }
    root.querySelector('#save-seq')?.addEventListener('click', saveSequence);
    root.querySelector('#start-seq')?.addEventListener('click', startSequence);
    root.querySelector('#write')?.addEventListener('click', askClaudeToWrite);
    root.querySelectorAll('[data-people-step]').forEach((el) => el.addEventListener('click', () => {
      peopleStep = Number(el.getAttribute('data-people-step'));
      selectedMessageId = null;
      pendingSend = false;
      render();
    }));
    root.querySelectorAll('.person').forEach((el) => el.addEventListener('click', () => {
      selectedId = el.getAttribute('data-id');
      selectedMessageId = el.getAttribute('data-msg');
      pendingSend = false;
      notice = '';
      render();
    }));
    const selected = (ws.contacts || []).find((c) => c.id === selectedId);
    root.querySelector('#save-draft')?.addEventListener('click', () => selected && saveDraft(selected));
    root.querySelector('#send')?.addEventListener('click', () => selected && sendNow(selected));
    root.querySelector('#schedule')?.addEventListener('click', () => selected && schedule(selected));
  }

  app.ontoolresult = (result) => {
    const parsed = parseToolResult(result);
    if (parsed?.error && !parsed.projectId) { ws = null; setNotice(parsed.error, 'err'); return; }
    ws = parsed;
    applySurface();
    seqPane = 'flow';
    selectedStep = 0;
    selectedMessageId = null;
    syncDrafts();
    notice = '';
    render();
  };
  app.onhostcontextchanged = themeFromHost;
  await app.connect();
  themeFromHost();
  render();
})();
  </script>
</body>
</html>
