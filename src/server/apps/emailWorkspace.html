<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jargon email</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--color-background-primary, #fff);
      --bg2: var(--color-background-secondary, #f4f4f2);
      --fg: var(--color-text-primary, #161513);
      --muted: var(--color-text-secondary, #6b6966);
      --line: var(--color-border-tertiary, #e4e2dc);
      --accent: var(--color-text-accent, #161513);
      --danger: #b42318;
      --ok: #17663a;
      --pad: 14px;
      font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    :root.dark {
      --bg: var(--color-background-primary, #1c1b19);
      --bg2: var(--color-background-secondary, #242320);
      --fg: var(--color-text-primary, #f4f2ee);
      --muted: var(--color-text-secondary, #a8a59e);
      --line: var(--color-border-tertiary, #3a3834);
      --accent: var(--color-text-accent, #f4f2ee);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { padding: var(--pad); padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom, 0px)); }
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      border: 1px solid var(--line); background: var(--bg); border-radius: 8px;
      padding: 6px 10px; font-weight: 550;
    }
    .btn:hover { background: var(--bg2); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .btn.primary:hover { opacity: 0.92; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .tab {
      border: 0; background: transparent; padding: 8px 10px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab.on { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }
    .banner {
      background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; margin-bottom: 12px; color: var(--muted); font-size: 12px;
    }
    .banner.err { color: var(--danger); }
    .banner.ok { color: var(--ok); }
    label { display: block; font-size: 11px; color: var(--muted); margin: 6px 0 4px; }
    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); padding: 8px 10px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .people { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .person {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left;
      background: var(--bg); width: 100%; border-left: 0; border-right: 0; border-top: 0;
    }
    .person:last-child { border-bottom: 0; }
    .person:hover, .person.on { background: var(--bg2); }
    .meta { color: var(--muted); font-size: 12px; }
    .pill { font-size: 11px; color: var(--muted); }
    .composer { margin-top: 12px; }
    .to { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .row input[type="datetime-local"] { width: auto; min-width: 180px; }
    .empty { color: var(--muted); padding: 20px 4px; }
    .confirm { padding: 4px 2px 8px; max-width: 440px; }
    .confirm h1 { font-size: 16px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.02em; }
    .confirm .lede { font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
    .confirm dl { margin: 0 0 18px; }
    .confirm dt { font-size: 11px; color: var(--muted); margin-top: 10px; }
    .confirm dt:first-child { margin-top: 0; }
    .confirm dd { margin: 2px 0 0; }
    .confirm .actions { margin-top: 4px; }

    .seg {
      display: flex; gap: 4px; background: var(--bg2); border-radius: 8px; padding: 3px;
      width: fit-content; margin-bottom: 12px;
    }
    .seg button {
      border: 0; background: transparent; border-radius: 6px; padding: 5px 10px;
      color: var(--muted); font-weight: 550;
    }
    .seg button.on { background: var(--bg); color: var(--fg); }

    .canvas {
      background: var(--bg2);
      border-radius: 12px;
      padding: 28px 16px 36px;
    }
    .flow {
      display: flex; flex-direction: column; align-items: center;
      width: min(300px, 100%); margin: 0 auto;
    }
    .wire {
      width: 1.5px; height: 18px; background: color-mix(in srgb, var(--muted) 28%, transparent);
    }
    .joint {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--bg); border: 1.5px solid color-mix(in srgb, var(--muted) 35%, transparent);
    }
    .node {
      width: 100%; background: var(--bg); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px 11px; text-align: left;
      box-shadow: 0 1px 2px color-mix(in srgb, var(--fg) 6%, transparent);
    }
    button.node { cursor: pointer; }
    button.node:hover { border-color: color-mix(in srgb, var(--muted) 55%, var(--line)); }
    button.node.on { border-color: var(--fg); }
    .node-top { display: flex; gap: 8px; align-items: flex-start; }
    .node-copy { min-width: 0; flex: 1; }
    .ico {
      width: 18px; height: 18px; display: grid; place-items: center;
      flex-shrink: 0; margin-top: 1px; color: var(--fg);
    }
    .ico svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .ico.bolt svg { fill: currentColor; stroke: none; }
    .kicker { font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
    .title { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview {
      color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; padding-top: 2px;
    }
    .live {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid color-mix(in srgb, var(--ok) 35%, var(--line));
      background: color-mix(in srgb, var(--ok) 8%, var(--bg));
      border-radius: 999px; padding: 3px 8px 3px 6px;
      font-size: 11px; font-weight: 650; color: var(--ok);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .mail-mini { width: 14px; height: 14px; color: var(--muted); }
    .mail-mini svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .editor {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; background: var(--bg);
    }
    .editor-h { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .editor-h strong { font-size: 13px; }
    .step-pills { display: flex; gap: 4px; flex-wrap: wrap; width: 100%; }
    .cadence { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .chip {
      font-size: 10px; font-weight: 650; border-radius: 999px;
      padding: 2px 7px; border: 1px solid var(--line); color: var(--muted);
    }
    .chip.queued { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
    .chip.sent { color: var(--ok); }
    .chip.cancelled, .chip.failed { color: var(--danger); }
    .when { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .filters { margin-bottom: 10px; }

    .statrow {
      display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .statrow div { display: flex; flex-direction: column; min-width: 64px; }
    .statrow strong { font-size: 18px; letter-spacing: -0.03em; }
    .statrow span { font-size: 11px; color: var(--muted); }
    .chan-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .chan {
      border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
      padding: 3px 8px; font-size: 11px; font-weight: 650; color: var(--muted);
    }
    .chan:hover { background: var(--bg2); }
    .chan.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .chan.next { border-color: var(--fg); color: var(--fg); }
    .chan.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
    .person.queue { grid-template-columns: 1fr auto; align-items: center; }
    .person.queue .pick {
      border: 0; background: transparent; padding: 0; text-align: left; width: 100%;
    }
    .person.queue .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .call-panel .kicker { margin: 0 0 8px; }

    .tab .count {
      display: inline-block; min-width: 17px; padding: 0 5px; margin-left: 4px;
      border-radius: 999px; background: var(--bg2); color: var(--muted);
      font-size: 10.5px; font-weight: 650; text-align: center;
    }
    .tab.on .count { background: var(--fg); color: var(--bg); }
    .task {
      display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left;
      background: var(--bg); width: 100%; border-left: 0; border-right: 0; border-top: 0;
    }
    .task:last-child { border-bottom: 0; }
    .task:hover, .task.on { background: var(--bg2); }
    .task .ico { color: var(--muted); }
    .task.today .ico, .task.overdue .ico { color: var(--fg); }
    .task.done .title, .task.skipped .title { color: var(--muted); }
    .due { font-size: 11px; font-weight: 650; color: var(--muted); white-space: nowrap; }
    .due.overdue { color: var(--danger); }
    .due.today { color: var(--fg); }
    .runner {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; margin-top: 12px; background: var(--bg);
    }
    .runner-h {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; margin-bottom: 4px; flex-wrap: wrap;
    }
    .runner-h .kicker { font-size: 12.5px; }
    .runner .banner { margin: 10px 0 0; }
    .nav { display: flex; gap: 6px; }
    .detail-panel {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; margin-top: 12px; background: var(--bg);
    }
    .detail-panel .kicker { margin-bottom: 4px; }
    .step-stat { font-size: 11px; color: var(--muted); font-weight: 650; }

    .dialer {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; margin-top: 12px; background: var(--bg);
    }
    .dial-h {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    .dial-h select {
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); padding: 5px 8px; max-width: 180px;
    }
    .dial-who { text-align: center; margin-top: 14px; font-weight: 600; }
    .dial-num {
      text-align: center; font-size: 22px; font-weight: 600;
      letter-spacing: -0.01em; font-variant-numeric: tabular-nums; margin-top: 2px;
    }
    .dial-timer {
      text-align: center; color: var(--muted); font-size: 12px;
      font-variant-numeric: tabular-nums; min-height: 17px;
    }
    .dial-script { margin-top: 12px; }
    .dial-script p {
      margin: 0; color: var(--muted); font-size: 12.5px;
      white-space: pre-wrap; line-height: 1.5;
    }
    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      width: min(250px, 100%); margin: 14px auto 0;
    }
    .key {
      border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
      padding: 9px 0; display: grid; justify-items: center; gap: 1px;
    }
    .key:hover { background: var(--bg2); }
    .key span { font-size: 17px; font-weight: 550; line-height: 1.1; }
    .key em {
      font-style: normal; font-size: 8.5px; font-weight: 650;
      letter-spacing: 0.08em; color: var(--muted); min-height: 10px;
    }
    .dial-actions {
      display: flex; gap: 8px; justify-content: center;
      margin-top: 14px; flex-wrap: wrap;
    }
    .btn.call { background: var(--ok); border-color: var(--ok); color: #fff; }
    .btn.end { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn.call:hover, .btn.end:hover { opacity: 0.92; }
    .btn.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  </style>
</head>
<body>
  <div class="wrap" id="root"><p class="empty">Loading workspace…</p></div>
  <script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App, applyDocumentTheme } = globalThis.ExtApps;

/** Latest workspace payload. Shared by the top-level helpers and the app below. */
let ws = null;

const ICO = {
  bolt: '<svg viewBox="0 0 16 16"><polygon points="9,1 3.5,9 7.5,9 6.5,15 13,7 8.8,7"/></svg>',
  clock: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.2 1.4"/></svg>',
  mail: '<svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1.4"/><path d="m2.6 4.4 5.4 4 5.4-4"/></svg>',
  phone: '<svg viewBox="0 0 16 16"><path d="M4.2 2.8c.3-.3.8-.3 1.1 0l1.3 1.3c.3.3.3.8 0 1.1L5.6 6.2c.9 1.7 2.2 3 3.9 3.9l1.1-1.1c.3-.3.8-.3 1.1 0l1.3 1.3c.3.3.3.8 0 1.1l-.6.6c-.5.5-1.3.7-2 .4C7.4 11.4 4.6 8.6 3.6 5.4c-.3-.7-.1-1.5.4-2l.2-.6z"/></svg>',
  linkedin: '<svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5.2 6.6v4.2M5.2 5.1v.15M8.1 10.8V8.4c0-.5.4-.9.9-.9s.9.4.9.9v2.4"/></svg>',
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function interpolate(template, contact) {
  if (!template) return '';
  const first = (contact.name || '').split(/\s+/)[0] || contact.name || '';
  const last = (contact.name || '').split(/\s+/).slice(1).join(' ');
  const vars = {
    name: contact.name || '',
    first_name: first,
    last_name: last,
    email: contact.email || '',
    title: contact.title || '',
    company: contact.company || '',
    city: contact.city || '',
  };
  for (const [k, v] of Object.entries(contact.attrs || {})) {
    const text = Array.isArray(v) ? v.join(' · ') : String(v ?? '');
    vars[k] = text;
    vars[`attrs.${k}`] = text;
  }
  return template.replace(/\{\{\s*([^}]+)\s*\}\}/g, (_, raw) => vars[raw.trim()] ?? '');
}

function parseToolResult(result) {
  if (!result) return null;
  if (result.isError) {
    const t = result.content?.[0]?.text;
    return { error: t || 'Request failed' };
  }
  const text = result.content?.find((c) => c.type === 'text')?.text;
  if (!text) return result.structuredContent || result;
  try { return JSON.parse(text); } catch { return { error: text }; }
}

function latestMessage(ws, contactId) {
  return (ws.messages || []).find((m) => m.contactId === contactId && m.channel === 'email') || null;
}

function statusLabel(ws, contact) {
  const msg = latestMessage(ws, contact.id);
  if (msg?.status === 'sent') return 'Sent';
  if (msg?.status === 'queued') return 'Scheduled';
  if (msg?.status === 'draft') return 'Draft';
  if (!contact.email) return 'No email';
  return contact.status || 'Queued';
}

function oneLine(text) {
  return String(text || '').replace(/\s+/g, ' ').trim();
}

function messageFor(ws, contactId, step) {
  const channel = step?.channel || 'email';
  const msgs = (ws?.messages || []).filter((m) =>
    m.contactId === contactId &&
    m.channel === channel &&
    m.status !== 'cancelled' &&
    m.status !== 'failed'
  );
  if (step?.id) {
    const hit = msgs.find((m) => m.stepId === step.id);
    if (hit) return hit;
  }
  const firstOfChannel = (ws.steps || []).find((s) => s.channel === channel);
  if (step && firstOfChannel && step.id === firstOfChannel.id) {
    return msgs.find((m) => !m.stepId) || null;
  }
  return null;
}

function toLocalInput(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  if (Number.isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function cadenceLabel(ws, contact, steps) {
  let queued = 0;
  let drafted = 0;
  let sent = 0;
  let any = false;
  for (const step of steps) {
    const msg = messageFor(ws, contact.id, step);
    if (!msg) continue;
    any = true;
    if (msg.status === 'queued') queued += 1;
    if (msg.status === 'draft') drafted += 1;
    if (msg.status === 'sent') sent += 1;
  }
  if (queued) return `${queued} scheduled`;
  if (drafted) return `${drafted} drafted`;
  if (sent && sent === steps.length) return 'Sent';
  if (sent) return `${sent} sent`;
  return statusLabel(ws, contact);
}

function channelLabel(ch) {
  if (ch === 'call') return 'Call';
  if (ch === 'linkedin') return 'LinkedIn';
  return 'Email';
}

function workspaceChannels() {
  const ch = ws?.channels || [];
  if (ch.length) return ch;
  return ['email'];
}

function doneSet(contact) {
  return new Set(contact?.channelsDone || []);
}

function nextFor(contact) {
  if (!contact) return null;
  if (contact.nextChannel) return contact.nextChannel;
  const done = doneSet(contact);
  return workspaceChannels().find((ch) => !done.has(ch)) || null;
}

function progressLabel(contact) {
  const next = nextFor(contact);
  if (!next && (contact.channelsDone || []).length) return 'Done';
  if (next) return `Next · ${channelLabel(next)}`;
  return contact.status || 'Queued';
}

function latestChannelMessage(contactId, channel) {
  const step = (ws?.steps || []).find((s) => s.channel === channel);
  if (step) {
    const hit = messageFor(ws, contactId, step);
    if (hit) return hit;
  }
  return (ws?.messages || []).find((m) =>
    m.contactId === contactId &&
    m.channel === channel &&
    m.status !== 'cancelled' &&
    m.status !== 'failed'
  ) || null;
}

/** Re-bucket in the rep's timezone — the server buckets in its own. */
function taskBucket(task) {
  if (task.state === 'done') return 'done';
  if (task.state === 'skipped') return 'skipped';
  const start = new Date().setHours(0, 0, 0, 0);
  const end = new Date().setHours(23, 59, 59, 999);
  if (task.dueAt < start) return 'overdue';
  if (task.dueAt <= end) return 'today';
  return 'upcoming';
}

function taskCounts() {
  const counts = { overdue: 0, today: 0, upcoming: 0, done: 0, skipped: 0 };
  for (const task of ws?.tasks || []) counts[taskBucket(task)] += 1;
  counts.open = counts.overdue + counts.today;
  return counts;
}

function dueLabel(task) {
  const bucket = taskBucket(task);
  const d = new Date(task.dueAt);
  if (Number.isNaN(d.getTime())) return '';
  const time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  if (bucket === 'overdue') return `Overdue · ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
  if (bucket === 'today') return `Today · ${time}`;
  if (bucket === 'done') return `Done · ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
  if (bucket === 'skipped') return 'Skipped';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

(async () => {
  const app = new App({ name: 'jargon-outbound', version: '1.6.0' }, {}, { autoResize: true });
  const root = document.getElementById('root');
  let tab = 'contacts';
  let seqPane = 'flow';
  let selectedStep = 0;
  let selectedId = null;
  let selectedMessageId = null;
  let inboxFilter = 'all';
  let notice = '';
  let noticeTone = '';
  let busy = false;
  let pendingSend = false;
  let pendingStart = false;
  let pendingContactIds = null;
  let peopleStep = 0;
  let draftSteps = [];
  let actionPane = 'email';
  let callTimer = 0;
  let taskFilter = 'open';
  let selectedTaskId = null;
  let dialState = 'idle';
  let dialContactId = null;
  let dialDigits = '';
  let dialSeconds = 0;
  let dialMuted = false;
  let dialTicker = 0;
  let dialConnect = 0;

  function surface() {
    if (!ws) return 'sequence';
    if (ws.surface) return ws.surface;
    return ws.view === 'overflow' ? 'overflow' : 'sequence';
  }

  function applySurface() {
    const s = surface();
    const land = ws?.focus || ws?.defaultTab;
    if (land === 'tasks' || s === 'tasks') tab = 'tasks';
    else if (land === 'inbox' || s === 'inbox') tab = 'inbox';
    else if (land === 'queue' || s === 'queue') tab = 'queue';
    else if (land === 'sequence') tab = 'sequence';
    else tab = 'contacts';
  }

  function listSurface() {
    return surface() === 'queue' || surface() === 'tasks';
  }

  function visibleSteps() {
    if (listSurface()) return draftSteps;
    return emailSteps();
  }

  function emailSteps() {
    const emails = draftSteps.filter((s) => s.channel === 'email');
    return emails.length ? emails : draftSteps;
  }

  function syncDrafts() {
    draftSteps = (ws?.steps || []).map((s) => ({ ...s }));
    const n = emailSteps().length;
    if (selectedStep >= n) selectedStep = Math.max(0, n - 1);
    if (peopleStep >= n) peopleStep = Math.max(0, n - 1);
  }

  function themeFromHost() {
    const ctx = app.getHostContext?.() || {};
    const theme = ctx.theme === 'dark' ? 'dark' : 'light';
    document.documentElement.classList.toggle('dark', theme === 'dark');
    applyDocumentTheme?.(theme);
    const insets = ctx.safeAreaInsets;
    if (insets) {
      document.documentElement.style.setProperty('--pad', `${Math.max(14, insets.top || 0)}px`);
    }
  }

  function setNotice(text, tone) {
    notice = text || '';
    noticeTone = tone || '';
    render();
  }

  async function reload() {
    if (!ws?.projectId) return;
    const result = await app.callServerTool({
      name: 'load_email_workspace',
      arguments: { projectId: ws.projectId },
    });
    const next = parseToolResult(result);
    if (next?.error) { setNotice(next.error, 'err'); return; }
    ws = next;
    syncDrafts();
    render();
  }

  async function openWorkspace() {
    if (!ws?.dashboardUrl) return;
    await app.openLink({ url: ws.dashboardUrl });
  }

  function flushEditor() {
    const steps = emailSteps();
    const step = steps[selectedStep];
    if (!step || seqPane !== 'email') return;
    const dayEl = document.getElementById('edit-day');
    const labelEl = document.getElementById('edit-label');
    const subjectEl = document.getElementById('edit-subject');
    const bodyEl = document.getElementById('edit-body');
    if (dayEl) step.day = Number(dayEl.value || step.day || 0);
    if (labelEl) step.label = labelEl.value;
    if (subjectEl) step.subject = subjectEl.value;
    if (bodyEl) step.body = bodyEl.value;
  }

  async function saveSequence() {
    flushEditor();
    const originals = ws.steps || [];
    const hasEmail = originals.some((s) => s.channel === 'email');
    const edited = emailSteps();
    let i = 0;
    const steps = originals.map((step) => {
      if (hasEmail && step.channel !== 'email') {
        return { day: step.day, channel: step.channel, label: step.label, subject: step.subject, body: step.body };
      }
      const next = edited[i++] || step;
      return {
        day: Number(next.day || 0),
        channel: next.channel,
        label: next.label,
        subject: next.subject || '',
        body: next.body || '',
      };
    });
    busy = true; render();
    const result = await app.callServerTool({
      name: 'run_update_sequence',
      arguments: { projectId: ws.projectId, goal: ws.goal, steps },
    });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice('Sequence saved.', 'ok');
    app.updateModelContext?.({
      content: [{ type: 'text', text: `Updated email sequence for ${ws.name} (${steps.length} steps).` }],
    });
  }

  function selectedEmailMessage(contact) {
    if (selectedMessageId) {
      return (ws.messages || []).find((m) => m.id === selectedMessageId) || null;
    }
    if (!contact) return null;
    const step = emailSteps()[peopleStep] || emailSteps()[0];
    return messageFor(ws, contact.id, step) || latestMessage(ws, contact.id);
  }

  function currentDraftFields(contact) {
    const step = emailSteps()[peopleStep] || emailSteps()[0];
    const msg = selectedEmailMessage(contact);
    return {
      subject: document.getElementById('draft-subject')?.value
        ?? msg?.subject
        ?? interpolate(step?.subject || '', contact),
      body: document.getElementById('draft-body')?.value
        ?? msg?.body
        ?? interpolate(step?.body || '', contact),
    };
  }

  async function saveDraft(contact) {
    const { subject, body } = currentDraftFields(contact);
    const step = emailSteps()[peopleStep] || emailSteps()[0];
    const existing = selectedEmailMessage(contact);
    busy = true; render();
    const result = existing
      ? await app.callServerTool({
          name: 'run_update_draft',
          arguments: { messageId: existing.id, subject, body },
        })
      : await app.callServerTool({
          name: 'run_save_draft',
          arguments: { contactId: contact.id, subject, body, channel: 'email', stepId: step?.id },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice(`Draft saved for ${contact.name}.`, 'ok');
  }

  async function sendNow(contact) {
    if (!contact.email) { setNotice('This person has no email address.', 'err'); return; }
    if (!pendingSend) {
      pendingSend = true;
      setNotice(`Send to ${contact.email}? This uses Gmail credits.`, '');
      return;
    }
    pendingSend = false;
    const { subject, body } = currentDraftFields(contact);
    const existing = selectedEmailMessage(contact);
    busy = true; render();
    const result = existing && existing.status !== 'sent'
      ? await app.callServerTool({ name: 'run_send_draft', arguments: { messageId: existing.id } })
      : await app.callServerTool({
          name: 'run_send_message',
          arguments: { contactId: contact.id, subject, body, channel: 'email', status: 'sent' },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    if (listSurface()) {
      const next = (ws.contacts || []).find((c) => c.id === contact.id);
      if (nextFor(next) && next) actionPane = nextFor(next);
    }
    advanceTask();
    setNotice(`Sent to ${contact.name}.`, 'ok');
    app.updateModelContext?.({
      content: [{ type: 'text', text: `Sent email to ${contact.name} <${contact.email}>.` }],
    });
  }

  async function schedule(contact) {
    if (!contact.email) { setNotice('This person has no email address.', 'err'); return; }
    const when = document.getElementById('send-at')?.value;
    if (!when) { setNotice('Pick a send time.', 'err'); return; }
    const sendAt = new Date(when).toISOString();
    const { subject, body } = currentDraftFields(contact);
    const existing = selectedEmailMessage(contact);
    busy = true; render();
    const result = existing
      ? await app.callServerTool({
          name: 'run_update_draft',
          arguments: { messageId: existing.id, subject, body, sendAt, status: 'queued' },
        })
      : await app.callServerTool({
          name: 'run_send_message',
          arguments: { contactId: contact.id, subject, body, channel: 'email', status: 'queued', sendAt },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice(`Scheduled for ${contact.name}.`, 'ok');
  }

  async function startSequence(contactIds) {
    if (!pendingStart) {
      pendingStart = true;
      pendingContactIds = contactIds?.length ? contactIds : null;
      setNotice(
        pendingContactIds?.length === 1
          ? 'Enroll this person in the sequence?'
          : 'Start this sequence? Every step becomes a dated task — nothing sends until you send it or its day arrives.',
        ''
      );
      return;
    }
    pendingStart = false;
    const ids = contactIds?.length ? contactIds : pendingContactIds;
    pendingContactIds = null;
    busy = true; render();
    const args = { projectId: ws.projectId };
    if (ids?.length) args.contactIds = ids;
    const result = await app.callServerTool({
      name: 'run_start_sequence',
      arguments: args,
    });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    ws = parsed;
    syncDrafts();
    tab = 'tasks';
    const open = taskCounts().open;
    setNotice(open ? `${open} tasks due — work them here.` : 'Sequence started. Tasks land here on their send day.', 'ok');
    app.updateModelContext?.({
      content: [{ type: 'text', text: `Started the sequence for ${ws.name} (${ws.taskStats?.enrolled || ws.contactCount} enrolled). Work is on Tasks.` }],
    });
  }

  async function unenrollContact(contact) {
    busy = true; render();
    const result = await app.callServerTool({
      name: 'run_unenroll_contact',
      arguments: { contactId: contact.id },
    });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    ws = parsed;
    syncDrafts();
    setNotice(`${contact.name} unenrolled. Remaining steps stopped.`, 'ok');
  }

  async function skipCurrentTask() {
    const task = (ws.tasks || []).find((t) => t.id === selectedTaskId);
    if (!task) { stepTask(1); return; }
    busy = true; render();
    const result = await app.callServerTool({
      name: 'run_skip_task',
      arguments: { contactId: task.contactId, stepId: task.stepId },
    });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    advanceTask();
    setNotice(`Skipped ${task.contactName}.`, 'ok');
  }

  async function askClaudeToWrite() {
    const copySteps = (ws.steps || []).filter((s) => s.channel === 'email' || s.channel === 'linkedin');
    const stepLines = copySteps.length
      ? copySteps.map((s) => `- ${s.id} · day ${s.day} · ${s.channel} · ${s.label || s.channel}`).join('\n')
      : '';
    const research = `Research each contact and their company from this chat. Write personalized copy — not the sequence fallback templates (Hi {{first_name}}, noticed {{company}}…). Call save_draft for each person. Pass stepId when writing a follow-up step. Then call show_email_workspace.`;
    await app.sendMessage({
      role: 'user',
      content: [{
        type: 'text',
        text: surface() === 'one_off'
            ? `Write a personalized one-off email for each contact in project ${ws.projectId} using their fields and the research in this chat. Call save_draft for each person who has an email, then call show_email_workspace. Do not start a sequence.`
            : listSurface()
              ? `Write personalized email and LinkedIn drafts for each contact in project ${ws.projectId}. ${research} Call save_draft with channel email or linkedin.${stepLines ? `\n\nSteps:\n${stepLines}` : ''}`
              : `Write personalized drafts for each contact in project ${ws.projectId}. ${research}${stepLines ? `\n\nSteps:\n${stepLines}` : ''}`,
      }],
    });
  }

  async function startCall(contact) {
    busy = true; render();
    const result = await app.callServerTool({
      name: 'run_start_call',
      arguments: { contactId: contact.id },
    });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    if (ws.openCall?.phase === 'dialing') {
      clearTimeout(callTimer);
      callTimer = setTimeout(() => reload(), 1300);
    }
    setNotice(`Calling ${contact.name}.`, 'ok');
  }

  async function logCallOutcome(contact, status) {
    const call = ws.openCall && ws.openCall.contactId === contact.id ? ws.openCall : null;
    busy = true; render();
    const result = call && call.phase !== 'completed'
      ? await app.callServerTool({
          name: 'run_complete_call',
          arguments: { callId: call.id, disposition: status },
        })
      : await app.callServerTool({
          name: 'run_disposition',
          arguments: { contactId: contact.id, status, channel: 'call' },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    const next = (ws.contacts || []).find((c) => c.id === contact.id);
    if (nextFor(next) && next) actionPane = nextFor(next);
    advanceTask();
    resetDialer();
    setNotice(`Logged ${status.replace('_', ' ')} for ${contact.name}.`, 'ok');
  }

  async function saveLinkedInDraft(contact) {
    const body = document.getElementById('li-body')?.value
      || contact.linkedinPreview?.body
      || '';
    const step = (ws.steps || []).find((s) => s.channel === 'linkedin');
    const existing = latestChannelMessage(contact.id, 'linkedin');
    busy = true; render();
    const result = existing
      ? await app.callServerTool({
          name: 'run_update_draft',
          arguments: { messageId: existing.id, body },
        })
      : await app.callServerTool({
          name: 'run_save_draft',
          arguments: { contactId: contact.id, body, channel: 'linkedin', stepId: step?.id },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    setNotice(`LinkedIn draft saved for ${contact.name}.`, 'ok');
  }

  async function sendLinkedIn(contact) {
    if (!pendingSend) {
      pendingSend = true;
      setNotice(`Send LinkedIn to ${contact.name}?`, '');
      return;
    }
    pendingSend = false;
    const body = document.getElementById('li-body')?.value
      || contact.linkedinPreview?.body
      || '';
    const existing = latestChannelMessage(contact.id, 'linkedin');
    busy = true; render();
    const result = existing && existing.status !== 'sent'
      ? await app.callServerTool({ name: 'run_send_draft', arguments: { messageId: existing.id } })
      : await app.callServerTool({
          name: 'run_send_message',
          arguments: { contactId: contact.id, body, channel: 'linkedin', status: 'sent' },
        });
    busy = false;
    const parsed = parseToolResult(result);
    if (parsed?.error) { setNotice(parsed.error, 'err'); return; }
    await reload();
    const next = (ws.contacts || []).find((c) => c.id === contact.id);
    if (nextFor(next) && next) actionPane = nextFor(next);
    advanceTask();
    setNotice(`LinkedIn sent to ${contact.name}.`, 'ok');
    app.updateModelContext?.({
      content: [{ type: 'text', text: `Sent LinkedIn message to ${contact.name}.` }],
    });
  }

  async function openLinkedIn(contact) {
    if (!contact.linkedinUrl) { setNotice('No LinkedIn URL on this contact.', 'err'); return; }
    await app.openLink({ url: contact.linkedinUrl });
  }

  function renderOverflow() {
    root.innerHTML = `
      <header>
        <div>
          <h1>${esc(ws.name)}</h1>
          <div class="sub">${esc((ws.channels || []).join(' · ') || 'Workspace')} · ${ws.contactCount} contacts</div>
        </div>
        <div class="actions">
          <button class="btn primary" id="open">Open workspace</button>
        </div>
      </header>
      <div class="banner">This motion is not email. Continue in Jargon for the queue or dialer.</div>
    `;
    root.querySelector('#open')?.addEventListener('click', openWorkspace);
  }

  function connector() {
    return `<div class="wire"></div><div class="joint"></div><div class="wire"></div>`;
  }

  function triggerCard() {
    const who = ws.contactCount === 1 ? '1 contact enters' : `${ws.contactCount} contacts enter`;
    return `
      <div class="node">
        <div class="node-top">
          <span class="ico bolt">${ICO.bolt}</span>
          <div class="node-copy">
            <div class="kicker">Trigger</div>
            <div class="preview">${esc(who)}${ws.goal ? ` · ${esc(ws.goal)}` : ''}</div>
          </div>
        </div>
      </div>
    `;
  }

  function waitCard(i, days) {
    const n = Math.max(0, days);
    const label = n === 1 ? 'Wait 1 day' : `Wait ${n} days`;
    return `
      <button class="node wait" type="button" data-step="${i}">
        <div class="node-top">
          <span class="ico">${ICO.clock}</span>
          <div class="node-copy">
            <div class="kicker">${esc(label)}</div>
          </div>
        </div>
      </button>
    `;
  }

  function stepCard(step, i, live) {
    const title = step.label || `${channelLabel(step.channel)} ${i + 1}`;
    const preview = oneLine(step.subject || step.body) || (step.channel === 'call' ? 'Talk track from the queue' : 'No copy yet');
    const ico = step.channel === 'call' ? ICO.phone : step.channel === 'linkedin' ? ICO.linkedin : ICO.mail;
    const st = (ws.stepStats || []).find((row) => row.stepId === step.id);
    const counts = st && (st.sent || st.drafted || st.due)
      ? `${st.sent} sent${st.due ? ` · ${st.due} due` : st.drafted ? ` · ${st.drafted} drafted` : ''}`
      : '';
    return `
      <button class="node ${selectedStep === i && seqPane !== 'flow' ? 'on' : ''}" type="button" data-step="${i}">
        <div class="node-top">
          <span class="ico">${ico}</span>
          <div class="node-copy">
            <div class="title">${esc(title)}</div>
            <div class="preview">${esc(preview)}</div>
          </div>
        </div>
        <div class="foot">
          <span class="mail-mini">${ico}</span>
          ${counts ? `<span class="step-stat">${esc(counts)}</span>` : live && step.channel === 'email' ? `<span class="live"><span class="dot"></span>Live</span>` : `<span class="pill">${esc(channelLabel(step.channel))}</span>`}
        </div>
      </button>
    `;
  }

  const KEYS = [
    ['1', ''], ['2', 'ABC'], ['3', 'DEF'],
    ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'],
    ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'],
    ['*', ''], ['0', '+'], ['#', ''],
  ];

  function clockText(seconds) {
    return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
  }

  function dialerContact() {
    const people = ws.contacts || [];
    return people.find((c) => c.id === dialContactId) || people[0] || null;
  }

  function dialerNumber() {
    return dialDigits || dialerContact()?.phone || '';
  }

  function resetDialer(contactId) {
    clearTimeout(dialConnect);
    clearInterval(dialTicker);
    dialConnect = 0;
    dialTicker = 0;
    dialState = 'idle';
    dialSeconds = 0;
    dialMuted = false;
    dialDigits = '';
    if (contactId !== undefined) dialContactId = contactId;
  }

  function placeCall() {
    if (!dialerNumber()) { setNotice('No number yet — use the keypad to enter one.', 'err'); return; }
    clearTimeout(dialConnect);
    clearInterval(dialTicker);
    dialState = 'dialing';
    dialSeconds = 0;
    dialMuted = false;
    notice = '';
    render();
    dialConnect = setTimeout(() => {
      if (dialState !== 'dialing') return;
      dialState = 'connected';
      dialTicker = setInterval(() => {
        dialSeconds += 1;
        const el = document.getElementById('dial-timer');
        if (!el) { clearInterval(dialTicker); return; }
        el.textContent = clockText(dialSeconds);
      }, 1000);
      render();
    }, 1600);
  }

  function hangUp() {
    clearTimeout(dialConnect);
    clearInterval(dialTicker);
    dialState = dialSeconds ? 'ended' : 'idle';
    render();
  }

  function renderDialer(step) {
    const people = ws.contacts || [];
    const contact = dialerContact();
    const number = dialerNumber();
    const live = dialState === 'dialing' || dialState === 'connected';
    const status = dialState === 'dialing'
      ? 'Calling…'
      : dialState === 'connected'
        ? 'On the line'
        : dialState === 'ended'
          ? `Ended · ${clockText(dialSeconds)}`
          : [contact?.title, contact?.company].filter(Boolean).join(' · ') || 'Ready';
    const script = contact ? interpolate(step.body || '', contact) : step.body || '';
    return `
      <div class="dialer">
        <div class="dial-h">
          <div>
            <div class="kicker">${esc(step.label || 'Call')}</div>
            <div class="meta">${esc(status)}</div>
          </div>
          ${people.length > 1 && !live ? `
            <select id="dial-who">
              ${people.map((c) => `<option value="${esc(c.id)}" ${c.id === contact?.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
            </select>
          ` : ''}
        </div>
        <div class="dial-who">${esc(contact?.name || 'Keypad')}</div>
        <div class="dial-num">${esc(number || 'Enter a number')}</div>
        <div class="dial-timer" id="dial-timer">${live ? clockText(dialSeconds) : ''}</div>
        ${script ? `
          <div class="dial-script">
            <label>Talk track</label>
            <p>${esc(script)}</p>
          </div>
        ` : ''}
        <div class="keypad">
          ${KEYS.map(([key, sub]) => `
            <button type="button" class="key" data-key="${esc(key)}"><span>${esc(key)}</span><em>${esc(sub)}</em></button>
          `).join('')}
        </div>
        <div class="dial-actions">
          ${live ? `
            <button class="btn ${dialMuted ? 'on' : ''}" id="dial-mute">${dialMuted ? 'Unmute' : 'Mute'}</button>
            <button class="btn end" id="dial-end">End call</button>
          ` : `
            ${dialDigits ? `<button class="btn" id="dial-back">Delete</button>` : ''}
            <button class="btn call" id="dial-call">${dialState === 'ended' ? 'Call again' : 'Call'}</button>
          `}
        </div>
        ${dialState === 'ended' ? `
          <label>Log outcome</label>
          <div class="row">
            <button class="btn" data-disp="interested" ${busy ? 'disabled' : ''}>Interested</button>
            <button class="btn" data-disp="no_answer" ${busy ? 'disabled' : ''}>No answer</button>
            <button class="btn" data-disp="not_interested" ${busy ? 'disabled' : ''}>Not interested</button>
            <button class="btn" data-disp="completed" ${busy ? 'disabled' : ''}>Done</button>
          </div>
        ` : ''}
      </div>
    `;
  }

  function dialerPane() {
    if (seqPane !== 'call') return '';
    const step = visibleSteps()[selectedStep];
    if (!step || step.channel !== 'call') return '';
    return renderDialer(step);
  }

  function renderFlow() {
    const steps = visibleSteps();
    const live = Boolean(ws.emailLive) && !ws.sandbox;
    let html = `<div class="canvas"><div class="flow">${triggerCard()}`;
    steps.forEach((step, i) => {
      const prev = i === 0 ? 0 : Number(steps[i - 1].day || 0);
      const wait = Number(step.day || 0) - prev;
      html += connector();
      if (wait > 0) {
        html += waitCard(i, wait);
        html += connector();
      }
      html += stepCard(step, i, live);
    });
    if (!steps.length) html += `${connector()}<p class="empty">No steps yet.</p>`;
    html += `</div></div>`;
    return html;
  }

  function renderEmailEditor() {
    const steps = emailSteps();
    const step = steps[selectedStep];
    if (!step) return '<p class="empty">No email selected.</p>';
    return `
      <div class="editor">
        <div class="step-pills">
          ${steps.map((s, i) => `<button class="btn ${i === selectedStep ? 'primary' : ''}" type="button" data-step="${i}">${esc(s.label || `Email ${i + 1}`)}</button>`).join('')}
        </div>
        <div class="editor-h">
          <strong>Email ${selectedStep + 1}${steps.length > 1 ? ` of ${steps.length}` : ''}</strong>
        </div>
        <p class="sub">Shared fallback. Personalized drafts per contact win when you start the sequence.</p>
        <label>Send on day</label>
        <input id="edit-day" type="text" value="${esc(step.day)}" />
        <label>Label</label>
        <input id="edit-label" type="text" value="${esc(step.label || '')}" />
        <label>Subject</label>
        <input id="edit-subject" type="text" value="${esc(step.subject || '')}" />
        <label>Body</label>
        <textarea id="edit-body">${esc(step.body || '')}</textarea>
      </div>
    `;
  }

  function renderSequence() {
    const enrolled = ws.taskStats?.enrolled || 0;
    const open = taskCounts().open;
    const queue = listSurface();
    const banner = enrolled
      ? `<div class="banner ok">${enrolled} enrolled · ${open} due now</div>`
      : '';
    const actions = `
      <div class="row">
        ${emailSteps().length && !queue ? `<button class="btn primary" id="start-seq" ${busy ? 'disabled' : ''}>${pendingStart ? 'Confirm start' : enrolled ? 'Enroll remaining' : 'Start sequence'}</button>` : ''}
        ${emailSteps().length && queue ? `<button class="btn primary" id="start-seq" ${busy ? 'disabled' : ''}>${pendingStart ? 'Confirm start' : 'Start sequence'}</button>` : ''}
        ${enrolled ? `<button class="btn" id="work-tasks">Work tasks</button>` : ''}
        <button class="btn" id="save-seq" ${busy ? 'disabled' : ''}>Save sequence</button>
        ${queue ? '' : `<button class="btn" id="write">Ask Claude to write drafts</button>`}
      </div>
    `;
    if (queue) {
      return `
        ${banner}
        ${renderFlow()}
        ${dialerPane()}
        ${actions}
      `;
    }
    return `
      ${banner}
      <div class="seg">
        <button type="button" class="${seqPane === 'flow' ? 'on' : ''}" data-pane="flow">Flow</button>
        <button type="button" class="${seqPane === 'email' ? 'on' : ''}" data-pane="email">Emails</button>
      </div>
      ${seqPane === 'call' ? `${renderFlow()}${dialerPane()}` : seqPane === 'flow' ? renderFlow() : renderEmailEditor()}
      ${actions}
    `;
  }

  function contactById(id) {
    return (ws.contacts || []).find((c) => c.id === id) || null;
  }

  function inboxMessages() {
    let msgs = (ws.messages || []).filter((m) => m.channel === 'email');
    msgs = [...msgs].sort((a, b) => (b.sentAt || b.sendAt || b.createdAt || 0) - (a.sentAt || a.sendAt || a.createdAt || 0));
    if (inboxFilter !== 'all') msgs = msgs.filter((m) => m.status === inboxFilter);
    return msgs;
  }

  function formatWhen(msg) {
    const ms = msg.sentAt || msg.sendAt || msg.createdAt;
    if (!ms) return '';
    const d = new Date(ms);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function renderComposer(selected, opts) {
    const hideSteps = Boolean(opts?.hideSteps);
    const showWrite = Boolean(opts?.showWrite);
    const steps = emailSteps();
    if (peopleStep >= steps.length) peopleStep = Math.max(0, steps.length - 1);
    const step = steps[peopleStep] || steps[0];
    const msg = selected ? selectedEmailMessage(selected) : null;
    const subject = msg?.subject || (selected && step ? interpolate(step.subject || '', selected) : '');
    const body = msg?.body || (selected && step ? interpolate(step.body || '', selected) : '');
    const showSteps = !hideSteps && steps.length > 1;
    return `
      <div class="composer">
        <div class="to">${esc(selected.name)} · ${esc(selected.email || 'missing email')}</div>
        ${showSteps ? `
          <div class="step-pills" style="margin: 8px 0;">
            ${steps.map((s, i) => {
              const m = messageFor(ws, selected.id, s);
              const st = m?.status || 'template';
              return `<button class="btn ${i === peopleStep ? 'primary' : ''}" type="button" data-people-step="${i}">${esc(s.label || `Email ${i + 1}`)} <span class="chip ${esc(st)}">${esc(st)}</span></button>`;
            }).join('')}
          </div>
        ` : ''}
        <label>Subject</label>
        <input id="draft-subject" type="text" value="${esc(subject)}" />
        <label>Body</label>
        <textarea id="draft-body">${esc(body)}</textarea>
        <div class="row">
          <button class="btn" id="save-draft" ${busy ? 'disabled' : ''}>Save draft</button>
          <button class="btn primary" id="send" ${busy || !selected.email || msg?.status === 'sent' ? 'disabled' : ''}>${pendingSend ? 'Confirm send' : 'Send now'}</button>
          <input id="send-at" type="datetime-local" value="${esc(toLocalInput(msg?.sendAt))}" />
          <button class="btn" id="schedule" ${busy || !selected.email || msg?.status === 'sent' ? 'disabled' : ''}>Schedule</button>
          ${showWrite ? `<button class="btn" id="write">Ask Claude to write</button>` : ''}
        </div>
      </div>
    `;
  }

  function contactEnrolled(contact) {
    if (!contact) return false;
    if ((ws.tasks || []).some((t) => t.contactId === contact.id)) return true;
    return Boolean(contact.status && contact.status !== 'queued');
  }

  function contactNextLabel(contact) {
    const next = (ws.tasks || []).find((t) => t.contactId === contact.id && t.state !== 'done' && t.state !== 'skipped');
    if (next) return next.stepLabel;
    if (contactEnrolled(contact)) return 'Caught up';
    return 'Not enrolled';
  }

  function renderContactDetail(contact) {
    const enrolled = contactEnrolled(contact);
    const next = (ws.tasks || []).find((t) => t.contactId === contact.id && t.state !== 'done' && t.state !== 'skipped');
    const anyEnrolled = (ws.taskStats?.enrolled || 0) > 0;
    const missing = workspaceChannels().includes('email') && !contact.email;
    return `
      <div class="detail-panel">
        <div class="kicker">${esc(contact.name)}</div>
        <div class="meta">${esc([contact.title, contact.company, contact.email || 'no email'].filter(Boolean).join(' · '))}</div>
        <div class="meta" style="margin-top:6px;">${esc(contactNextLabel(contact))}${contact.status ? ` · ${esc(String(contact.status).replace('_', ' '))}` : ''}</div>
        ${missing ? '<div class="banner err" style="margin-top:10px;">Missing email — add one in Claude or the full workspace.</div>' : ''}
        <div class="row">
          ${!enrolled ? `<button class="btn primary" id="enroll-one" ${busy ? 'disabled' : ''}>${pendingStart ? 'Confirm enroll' : 'Enroll this person'}</button>` : ''}
          ${next ? `<button class="btn primary" id="work-contact-task">Work next task</button>` : ''}
          ${enrolled ? `<button class="btn" id="unenroll" ${busy ? 'disabled' : ''}>Unenroll</button>` : ''}
          ${!anyEnrolled ? `<button class="btn" id="start-seq" ${busy ? 'disabled' : ''}>${pendingStart ? 'Confirm start' : 'Start sequence'}</button>` : `<button class="btn" id="work-tasks">Work tasks</button>`}
          <button class="btn" id="goto-sequence">Edit sequence</button>
        </div>
      </div>
    `;
  }

  function renderPeople() {
    const people = ws.contacts || [];
    const oneOff = surface() === 'one_off';
    const selected = people.find((c) => c.id === selectedId) || people[0];
    if (selected && selectedId !== selected.id) {
      selectedId = selected.id;
      selectedMessageId = null;
      pendingSend = false;
    }
    return `
      ${!people.length ? '<p class="empty">No contacts yet. Import a list in Claude, or connect HubSpot / Railway and deploy again.</p>' : `
        ${ws.contactsTotal > people.length ? `<div class="banner">Showing ${people.length} of ${ws.contactsTotal}. Open workspace for the full list.</div>` : ''}
        ${oneOff ? `<p class="sub" style="margin: 0 0 10px;">One-off emails — edit and send each person. No cadence.</p>` : ''}
        <div class="people">
          ${people.map((c) => `
            <button class="person ${c.id === selectedId ? 'on' : ''}" data-id="${esc(c.id)}">
              <div>
                <div>${esc(c.name)}</div>
                <div class="meta">${esc([c.title, c.company, c.email || 'no email'].filter(Boolean).join(' · '))}</div>
              </div>
              <div class="pill">${esc(oneOff ? statusLabel(ws, c) : contactNextLabel(c))}</div>
            </button>
          `).join('')}
        </div>
      `}
      ${selected && oneOff ? renderComposer(selected, { hideSteps: true, showWrite: true }) : ''}
      ${selected && !oneOff ? renderContactDetail(selected) : ''}
    `;
  }

  function selectAction(contact, pane) {
    selectedId = contact.id;
    selectedMessageId = null;
    pendingSend = false;
    actionPane = pane || nextFor(contact) || workspaceChannels()[0] || 'email';
  }

  function renderChannelButtons(contact) {
    const done = doneSet(contact);
    const next = nextFor(contact);
    const selected = contact.id === selectedId;
    return `
      <div class="chan-btns">
        ${workspaceChannels().map((ch) => {
          const on = selected && actionPane === ch;
          const isDone = done.has(ch);
          const isNext = next === ch;
          return `<button type="button" class="chan ${on ? 'on' : ''} ${isDone ? 'done' : ''} ${isNext && !on ? 'next' : ''}" data-act="${esc(ch)}" data-id="${esc(contact.id)}">${isDone ? '✓ ' : ''}${esc(channelLabel(ch))}</button>`;
        }).join('')}
      </div>
    `;
  }

  function renderCallPanel(contact) {
    const call = ws.openCall && ws.openCall.contactId === contact.id ? ws.openCall : null;
    const done = doneSet(contact).has('call');
    const phase = call?.phase;
    return `
      <div class="composer call-panel">
        <div class="to">${esc(contact.name)} · ${esc(contact.phone || 'No number on file')}</div>
        ${phase === 'dialing' ? '<p class="empty">Connecting…</p>' : ''}
        ${phase === 'connected' ? '<p class="kicker">On the line</p>' : ''}
        ${done && !call ? '<p class="sub">Call logged.</p>' : ''}
        <div class="row">
          <button class="btn primary" id="start-call" ${busy || (phase && phase !== 'completed') ? 'disabled' : ''}>Start call</button>
        </div>
        <label>Log outcome</label>
        <div class="row">
          <button class="btn" data-disp="interested" ${busy ? 'disabled' : ''}>Interested</button>
          <button class="btn" data-disp="no_answer" ${busy ? 'disabled' : ''}>No answer</button>
          <button class="btn" data-disp="not_interested" ${busy ? 'disabled' : ''}>Not interested</button>
          <button class="btn" data-disp="completed" ${busy ? 'disabled' : ''}>Done</button>
        </div>
      </div>
    `;
  }

  function renderLinkedInPanel(contact) {
    const step = (ws.steps || []).find((s) => s.channel === 'linkedin');
    const msg = latestChannelMessage(contact.id, 'linkedin');
    const body = msg?.body || contact.linkedinPreview?.body || (step ? interpolate(step.body || '', contact) : '');
    const sent = msg?.status === 'sent' || doneSet(contact).has('linkedin');
    return `
      <div class="composer">
        <div class="to">${esc(contact.name)} · ${esc(contact.linkedinUrl || 'No LinkedIn URL')}</div>
        <label>Message</label>
        <textarea id="li-body">${esc(body)}</textarea>
        <div class="row">
          <button class="btn primary" id="send-li" ${busy || sent ? 'disabled' : ''}>${pendingSend ? 'Confirm send' : sent ? 'Sent' : 'Send LinkedIn'}</button>
          <button class="btn" id="save-li" ${busy || sent ? 'disabled' : ''}>Save draft</button>
          ${contact.linkedinUrl ? '<button class="btn" id="open-li">Open profile</button>' : ''}
        </div>
      </div>
    `;
  }

  function renderQueueAction(selected) {
    const pane = actionPane || nextFor(selected) || 'email';
    if (pane === 'call') return renderCallPanel(selected);
    if (pane === 'linkedin') return renderLinkedInPanel(selected);
    return renderComposer(selected, { hideSteps: true, showWrite: true });
  }

  function visibleTasks() {
    const tasks = ws.tasks || [];
    if (taskFilter === 'all') return tasks;
    if (taskFilter === 'upcoming') return tasks.filter((t) => taskBucket(t) === 'upcoming');
    if (taskFilter === 'done') return tasks.filter((t) => taskBucket(t) === 'done' || taskBucket(t) === 'skipped');
    return tasks.filter((t) => taskBucket(t) === 'overdue' || taskBucket(t) === 'today');
  }

  function selectTask(task) {
    selectedTaskId = task.id;
    selectedId = task.contactId;
    selectedMessageId = task.messageId || null;
    actionPane = task.channel;
    pendingSend = false;
    const idx = emailSteps().findIndex((s) => s.id === task.stepId);
    if (idx >= 0) peopleStep = idx;
  }

  /** After finishing a task, drop the selection so the next due one opens. */
  function advanceTask() {
    if (tab === 'tasks') selectedTaskId = null;
  }

  function stepTask(delta) {
    const tasks = visibleTasks();
    const idx = tasks.findIndex((t) => t.id === selectedTaskId);
    const next = tasks[idx + delta];
    if (!next) return;
    selectTask(next);
    notice = '';
    render();
  }

  function taskAction(task) {
    if (task.channel === 'call') return renderCallPanel(contactById(task.contactId));
    if (task.channel === 'linkedin') return renderLinkedInPanel(contactById(task.contactId));
    return renderComposer(contactById(task.contactId), { hideSteps: true, showWrite: true });
  }

  function taskRow(task) {
    const bucket = taskBucket(task);
    const ico = task.channel === 'call' ? ICO.phone : task.channel === 'linkedin' ? ICO.linkedin : ICO.mail;
    const line = task.reason || oneLine(task.subject || task.body) || channelLabel(task.channel);
    return `
      <button class="task ${task.id === selectedTaskId ? 'on' : ''} ${bucket}" data-task="${esc(task.id)}">
        <span class="ico">${ico}</span>
        <div class="node-copy">
          <div class="title">${esc(task.contactName)} · ${esc(task.stepLabel)}</div>
          <div class="preview">${esc(line)}</div>
        </div>
        <div class="due ${bucket}">${esc(dueLabel(task))}</div>
      </button>
    `;
  }

  function renderTasks() {
    const counts = taskCounts();
    if (!(ws.tasks || []).length) {
      return `
        <p class="empty">No one is enrolled yet. Start the sequence and every step becomes a dated task here.</p>
        <div class="row">
          <button class="btn primary" id="start-seq" ${busy ? 'disabled' : ''}>${pendingStart ? 'Confirm start' : 'Start sequence'}</button>
        </div>
      `;
    }
    const tasks = visibleTasks();
    const current = tasks.find((t) => t.id === selectedTaskId) || tasks[0];
    if (current && current.id !== selectedTaskId) selectTask(current);
    const position = current ? tasks.indexOf(current) + 1 : 0;
    const contact = current ? contactById(current.contactId) : null;
    return `
      <div class="statrow">
        <div><strong>${counts.overdue}</strong><span>overdue</span></div>
        <div><strong>${counts.today}</strong><span>due today</span></div>
        <div><strong>${counts.upcoming}</strong><span>upcoming</span></div>
        <div><strong>${counts.done}</strong><span>done</span></div>
      </div>
      <div class="seg filters">
        ${[['open', `Due now (${counts.open})`], ['upcoming', `Upcoming (${counts.upcoming})`], ['done', `Done (${counts.done + counts.skipped})`], ['all', 'All']].map(([key, label]) => `
          <button type="button" class="${taskFilter === key ? 'on' : ''}" data-task-filter="${key}">${esc(label)}</button>
        `).join('')}
      </div>
      ${!tasks.length ? `<p class="empty">Nothing in this filter.${taskFilter === 'open' ? ' Today is clear.' : ''}</p>` : `
        <div class="people">${tasks.map(taskRow).join('')}</div>
      `}
      ${current && contact ? `
        <div class="runner">
          <div class="runner-h">
            <div>
              <div class="kicker">Task ${position} of ${tasks.length} · ${esc(channelLabel(current.channel))}</div>
              <div class="meta">${esc(contact.name)}${current.contactMeta ? ` · ${esc(current.contactMeta)}` : ''} · ${esc(dueLabel(current))}</div>
            </div>
            <div class="nav">
              <button class="btn" id="task-prev" ${position <= 1 ? 'disabled' : ''}>Previous</button>
              <button class="btn" id="task-next" ${position >= tasks.length ? 'disabled' : ''}>Skip</button>
            </div>
          </div>
          ${current.reason ? `<div class="banner">${esc(current.reason)}</div>` : ''}
          ${taskAction(current)}
        </div>
      ` : ''}
    `;
  }

  function renderQueue() {
    const people = ws.contacts || [];
    const selected = people.find((c) => c.id === selectedId) || people[0];
    if (selected && selectedId !== selected.id) {
      selectAction(selected, nextFor(selected));
    } else if (selected && !workspaceChannels().includes(actionPane)) {
      actionPane = nextFor(selected) || workspaceChannels()[0] || 'email';
    }
    const remaining = ws.stats?.remaining ?? people.filter((c) => nextFor(c)).length;
    return `
      ${!people.length ? '<p class="empty">No contacts yet. Import a list in Claude, or connect HubSpot / Railway and deploy again.</p>' : `
        <div class="statrow">
          <div><strong>${remaining}</strong><span>remaining</span></div>
          ${workspaceChannels().includes('email') ? `<div><strong>${ws.stats?.emailed ?? 0}</strong><span>emailed</span></div>` : ''}
          ${workspaceChannels().includes('call') ? `<div><strong>${ws.stats?.called ?? 0}</strong><span>called</span></div>` : ''}
          ${workspaceChannels().includes('linkedin') ? `<div><strong>${ws.stats?.linkedin ?? 0}</strong><span>LinkedIn</span></div>` : ''}
        </div>
        ${ws.contactsTotal > people.length ? `<div class="banner">Showing ${people.length} of ${ws.contactsTotal}. Open workspace for the full list.</div>` : ''}
        <div class="people">
          ${people.map((c) => `
            <div class="person queue ${c.id === selectedId ? 'on' : ''}" data-id="${esc(c.id)}">
              <button type="button" class="pick" data-id="${esc(c.id)}">
                <div>${esc(c.name)}</div>
                <div class="meta">${esc([c.title, c.company, c.phone || c.email || c.linkedinUrl].filter(Boolean).join(' · '))}</div>
              </button>
              <div class="side">
                <div class="pill">${esc(progressLabel(c))}</div>
                ${renderChannelButtons(c)}
              </div>
            </div>
          `).join('')}
        </div>
      `}
      ${selected ? renderQueueAction(selected) : ''}
    `;
  }

  function renderInbox() {
    const msgs = inboxMessages();
    const selectedMsg = msgs.find((m) => m.id === selectedMessageId) || msgs[0] || null;
    if (selectedMsg) {
      selectedMessageId = selectedMsg.id;
      selectedId = selectedMsg.contactId;
    }
    const selected = selectedMsg ? contactById(selectedMsg.contactId) : (ws.contacts || []).find((c) => c.id === selectedId) || (ws.contacts || [])[0];
    const counts = {
      all: (ws.messages || []).filter((m) => m.channel === 'email').length,
      draft: ws.stats?.drafts || 0,
      queued: ws.stats?.queued || 0,
      sent: ws.stats?.sent || 0,
    };
    return `
      <div class="seg filters">
        ${['all', 'draft', 'queued', 'sent'].map((f) => `
          <button type="button" class="${inboxFilter === f ? 'on' : ''}" data-filter="${f}">${f === 'all' ? `All (${counts.all})` : `${f[0].toUpperCase()}${f.slice(1)} (${counts[f]})`}</button>
        `).join('')}
      </div>
      ${!msgs.length ? `<p class="empty">${counts.all ? 'Nothing in this filter.' : 'No emails yet. Start the sequence to generate tasks, or send from Tasks.'}</p>` : `
        <div class="people">
          ${msgs.map((m) => {
            const c = contactById(m.contactId);
            return `
              <button class="person ${m.id === selectedMessageId ? 'on' : ''}" data-msg="${esc(m.id)}" data-id="${esc(m.contactId)}">
                <div>
                  <div>${esc(c?.name || 'Unknown')} · ${esc(m.subject || '(no subject)')}</div>
                  <div class="meta">${esc(oneLine(m.body) || '—')}</div>
                </div>
                <div>
                  <div class="chip ${esc(m.status)}">${esc(m.status)}</div>
                  <div class="when">${esc(formatWhen(m))}</div>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `}
      ${selected ? renderComposer(selected, { hideSteps: true, showWrite: !msgs.length }) : ''}
    `;
  }

  const TAB_LABELS = { tasks: 'Tasks', queue: 'Queue', sequence: 'Sequence', contacts: 'Contacts', inbox: 'Inbox' };

  function tabsFor() {
    const s = surface();
    if (s === 'one_off') return ['contacts', 'inbox'];
    if (s === 'queue' || s === 'tasks') return ['contacts', 'queue', 'sequence', 'tasks'];
    return ['contacts', 'sequence', 'tasks', 'inbox'];
  }

  function renderTabs() {
    const names = tabsFor();
    if (!names.length) return '';
    const open = taskCounts().open;
    return `
      <div class="tabs">
        ${names.map((name) => `
          <button class="tab ${tab === name ? 'on' : ''}" data-tab="${name}">${TAB_LABELS[name]}${name === 'tasks' && open ? ` <span class="count">${open}</span>` : ''}</button>
        `).join('')}
      </div>
    `;
  }

  function renderPanel() {
    if (tab === 'tasks') return renderTasks();
    if (tab === 'queue') return renderQueue();
    if (tab === 'inbox') return renderInbox();
    if (tab === 'contacts') return renderPeople();
    return renderSequence();
  }

  function surfaceLabel() {
    const s = surface();
    if (s === 'inbox') return 'Inbox';
    if (s === 'one_off') return 'One-off emails';
    if (s === 'sequence') return 'Sequence';
    if (s === 'queue') return 'Queue';
    if (s === 'tasks') return 'Tasks';
    return '';
  }

  function headerMeta() {
    const sources = (ws.sources || [])
      .filter((s) => s.status === 'connected')
      .map((s) => s.accountLabel || s.provider)
      .join(', ');
    if (tab === 'tasks') {
      const counts = taskCounts();
      return `${counts.open} due now · ${counts.upcoming} upcoming · ${counts.done} done${sources ? ` · ${esc(sources)}` : ''}`;
    }
    if (tab === 'contacts') {
      const enrolled = ws.taskStats?.enrolled || 0;
      return `${ws.contactCount} contacts${enrolled ? ` · ${enrolled} enrolled` : ''}${ws.stats?.missingEmail ? ` · ${ws.stats.missingEmail} missing email` : ''}${sources ? ` · ${esc(sources)}` : ''}`;
    }
    if (tab === 'sequence') {
      const n = (ws.steps || []).length;
      const enrolled = ws.taskStats?.enrolled || 0;
      return `${n} steps${enrolled ? ` · ${enrolled} enrolled` : ' · not started'}${sources ? ` · ${esc(sources)}` : ''}`;
    }
    if (listSurface()) {
      const ch = workspaceChannels().map(channelLabel).join(' · ');
      const remaining = ws.stats?.remaining;
      return `${ch} · ${ws.contactCount} contacts${remaining != null ? ` · ${remaining} remaining` : ''}${sources ? ` · ${esc(sources)}` : ''}`;
    }
    const mail = ws.sandbox ? 'sandbox' : ws.emailLive ? 'Gmail live' : 'Gmail not configured';
    const kind = surfaceLabel();
    return `${kind ? `${esc(kind)} · ` : ''}${ws.contactCount} contacts · ${esc(mail)}${sources ? ` · ${esc(sources)}` : ''}${ws.stats?.missingEmail ? ` · ${ws.stats.missingEmail} missing email` : ''}`;
  }

  function applyWorkspace(parsed) {
    ws = parsed;
    applySurface();
    resetDialer(null);
    seqPane = 'flow';
    selectedStep = 0;
    selectedMessageId = null;
    selectedTaskId = null;
    taskFilter = 'open';
    syncDrafts();
    notice = '';
    const first = (ws.contacts || [])[0];
    if (listSurface() && first) {
      selectedId = first.id;
      actionPane = nextFor(first) || workspaceChannels()[0] || 'email';
    }
  }

  function render() {
    if (!ws) {
      root.innerHTML = '<p class="empty">Waiting for workspace data…</p>';
      return;
    }
    if (ws.view === 'overflow' || surface() === 'overflow') { renderOverflow(); return; }
    if (!draftSteps.length && ws.steps?.length) syncDrafts();
    root.innerHTML = `
      <header>
        <div>
          <h1>${esc(ws.name)}</h1>
          <div class="sub">${headerMeta()}</div>
        </div>
        <div class="actions">
          <button class="btn" id="full">Full screen</button>
          <button class="btn" id="open">Open workspace</button>
        </div>
      </header>
      ${notice ? `<div class="banner ${noticeTone}">${esc(notice)}</div>` : ''}
      ${renderTabs()}
      <div id="panel">${renderPanel()}</div>
    `;
    bindWorkspace();
  }

  function bindWorkspace() {
    root.querySelector('#open')?.addEventListener('click', openWorkspace);
    root.querySelector('#full')?.addEventListener('click', () => app.requestDisplayMode({ mode: 'fullscreen' }));
    root.querySelectorAll('.tab').forEach((el) => el.addEventListener('click', () => {
      flushEditor();
      resetDialer();
      tab = el.getAttribute('data-tab');
      if (tab !== 'inbox') selectedMessageId = null;
      render();
    }));
    root.querySelectorAll('[data-pane]').forEach((el) => el.addEventListener('click', () => {
      flushEditor();
      resetDialer();
      seqPane = el.getAttribute('data-pane');
      render();
    }));
    root.querySelectorAll('[data-step]').forEach((el) => el.addEventListener('click', () => {
      flushEditor();
      const next = Number(el.getAttribute('data-step'));
      const changed = next !== selectedStep;
      selectedStep = next;
      const step = visibleSteps()[selectedStep];
      seqPane = step?.channel === 'call' ? 'call' : 'email';
      if (seqPane === 'call') {
        if (changed || dialState === 'idle') resetDialer(selectedId ?? undefined);
        selectedId = dialerContact()?.id ?? selectedId;
      } else {
        resetDialer();
      }
      notice = '';
      render();
    }));
    root.querySelectorAll('[data-filter]').forEach((el) => el.addEventListener('click', () => {
      inboxFilter = el.getAttribute('data-filter');
      selectedMessageId = null;
      render();
    }));
    root.querySelectorAll('[data-task-filter]').forEach((el) => el.addEventListener('click', () => {
      taskFilter = el.getAttribute('data-task-filter');
      selectedTaskId = null;
      notice = '';
      render();
    }));
    root.querySelectorAll('[data-task]').forEach((el) => el.addEventListener('click', () => {
      const task = (ws.tasks || []).find((t) => t.id === el.getAttribute('data-task'));
      if (!task) return;
      selectTask(task);
      notice = '';
      render();
    }));
    root.querySelector('#task-prev')?.addEventListener('click', () => stepTask(-1));
    root.querySelector('#task-next')?.addEventListener('click', () => void skipCurrentTask());
    const editing = emailSteps()[selectedStep];
    if (editing && seqPane === 'email') {
      const bind = (id, key, parse) => {
        document.getElementById(id)?.addEventListener('input', (e) => {
          const value = e.target.value;
          editing[key] = parse ? parse(value) : value;
        });
      };
      bind('edit-day', 'day', (v) => Number(v || 0));
      bind('edit-label', 'label');
      bind('edit-subject', 'subject');
      bind('edit-body', 'body');
    }
    root.querySelectorAll('[data-key]').forEach((el) => el.addEventListener('click', () => {
      dialDigits = `${dialDigits}${el.getAttribute('data-key')}`.slice(0, 20);
      render();
    }));
    root.querySelector('#dial-back')?.addEventListener('click', () => {
      dialDigits = dialDigits.slice(0, -1);
      render();
    });
    root.querySelector('#dial-call')?.addEventListener('click', placeCall);
    root.querySelector('#dial-end')?.addEventListener('click', hangUp);
    root.querySelector('#dial-mute')?.addEventListener('click', () => {
      dialMuted = !dialMuted;
      render();
    });
    root.querySelector('#dial-who')?.addEventListener('change', (e) => {
      resetDialer(e.target.value);
      selectedId = dialContactId;
      render();
    });
    root.querySelector('#save-seq')?.addEventListener('click', saveSequence);
    root.querySelector('#start-seq')?.addEventListener('click', () => void startSequence());
    root.querySelector('#enroll-one')?.addEventListener('click', () => {
      const c = (ws.contacts || []).find((row) => row.id === selectedId);
      if (c) void startSequence([c.id]);
    });
    root.querySelector('#unenroll')?.addEventListener('click', () => {
      const c = (ws.contacts || []).find((row) => row.id === selectedId);
      if (c) void unenrollContact(c);
    });
    root.querySelector('#work-tasks')?.addEventListener('click', () => { tab = 'tasks'; notice = ''; render(); });
    root.querySelector('#goto-sequence')?.addEventListener('click', () => { tab = 'sequence'; notice = ''; render(); });
    root.querySelector('#work-contact-task')?.addEventListener('click', () => {
      const next = (ws.tasks || []).find((t) => t.contactId === selectedId && t.state !== 'done' && t.state !== 'skipped');
      if (next) selectTask(next);
      tab = 'tasks';
      notice = '';
      render();
    });
    root.querySelector('#write')?.addEventListener('click', askClaudeToWrite);
    root.querySelectorAll('[data-people-step]').forEach((el) => el.addEventListener('click', () => {
      peopleStep = Number(el.getAttribute('data-people-step'));
      selectedMessageId = null;
      pendingSend = false;
      render();
    }));
    root.querySelectorAll('.person').forEach((el) => el.addEventListener('click', () => {
      selectedId = el.getAttribute('data-id');
      selectedMessageId = el.getAttribute('data-msg');
      pendingSend = false;
      notice = '';
      render();
    }));
    root.querySelectorAll('.pick').forEach((el) => el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      const contact = (ws.contacts || []).find((c) => c.id === id);
      if (contact) selectAction(contact, nextFor(contact));
      pendingSend = false;
      notice = '';
      render();
    }));
    root.querySelectorAll('[data-act]').forEach((el) => el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      const pane = el.getAttribute('data-act');
      const contact = (ws.contacts || []).find((c) => c.id === id);
      if (!contact) return;
      selectAction(contact, pane);
      pendingSend = false;
      notice = '';
      render();
      if (pane === 'linkedin') void openLinkedIn(contact);
    }));
    const selected = (ws.contacts || []).find((c) => c.id === selectedId);
    root.querySelector('#save-draft')?.addEventListener('click', () => selected && saveDraft(selected));
    root.querySelector('#send')?.addEventListener('click', () => selected && sendNow(selected));
    root.querySelector('#schedule')?.addEventListener('click', () => selected && schedule(selected));
    root.querySelector('#start-call')?.addEventListener('click', () => selected && startCall(selected));
    root.querySelector('#send-li')?.addEventListener('click', () => selected && sendLinkedIn(selected));
    root.querySelector('#save-li')?.addEventListener('click', () => selected && saveLinkedInDraft(selected));
    root.querySelector('#open-li')?.addEventListener('click', () => selected && openLinkedIn(selected));
    root.querySelectorAll('[data-disp]').forEach((el) => el.addEventListener('click', () => {
      if (selected) void logCallOutcome(selected, el.getAttribute('data-disp'));
    }));
  }

  app.ontoolresult = (result) => {
    const parsed = parseToolResult(result);
    if (parsed?.error && !parsed.projectId) { ws = null; setNotice(parsed.error, 'err'); return; }
    if (!parsed?.projectId) return;
    applyWorkspace(parsed);
    render();
  };
  app.onhostcontextchanged = themeFromHost;
  await app.connect();
  themeFromHost();
  render();
})();
  </script>
</body>
</html>
