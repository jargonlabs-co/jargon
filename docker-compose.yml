services:
  api:
    build: .
    ports:
      - "8787:8787"
    environment:
      JARGON_API_HOST: 0.0.0.0
      PORT: 8787
      JARGON_PUBLIC_URL: ${JARGON_PUBLIC_URL:-http://localhost:8787}
      JARGON_APP_URL: ${JARGON_APP_URL:-http://localhost:5180}
      JARGON_ENCRYPTION_KEY: ${JARGON_ENCRYPTION_KEY:-dev-change-me}
      JARGON_DB_PATH: /data/jargon-db.json
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      HUBSPOT_SCOPES: ${HUBSPOT_SCOPES:-crm.objects.contacts.read crm.objects.companies.read oauth}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      HEYREACH_API_KEY: ${HEYREACH_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - jargon-data:/data
    restart: unless-stopped

volumes:
  jargon-data:
